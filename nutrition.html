<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리락쿠마 영양 연구소</title>
    <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        /* 배경색을 더 크림색으로 */
        body { background: #FFFDEB; padding: 30px; font-family: 'Poor Story', cursive; color: #5D4037; }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 30px; 
            max-width: 700px; 
            margin: auto; 
            /* 리락쿠마 테두리 색상 */
            border: 4px solid #FFD700; 
            box-shadow: 0 15px 0 #FFE082; 
        }
        /* 헤더에 캐릭터 배치 */
        .header-area { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 3px dashed #BCAAA4; padding-bottom: 20px; }
        .lab-master { width: 90px; border-radius: 50%; border: 3px solid #5D4037; padding: 5px; background: white; }
        
        .product-section { margin-bottom: 40px; }
        /* 제품 이미지도 둥글게 */
        .product-img { width: 100px; float: left; margin-right: 20px; border-radius: 20px; border: 2px solid #FFD700; }
        
        /* 표 스타일도 귀엽게 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #FFFBF2; border-radius: 15px; overflow: hidden;}
        th, td { padding: 10px; border-bottom: 1px solid #FFE082; text-align: left; font-size: 1.2rem; }
        th { color: #5D4037; background-color: #FFF3E0; }
        
        /* 바도 리락쿠마 색상으로 */
        .bar-container { background: #FFE082; border-radius: 10px; height: 15px; margin: 5px 0 15px 0; }
        .bar { background: #8D6E63; height: 100%; border-radius: 10px; }
        
        /* 돌아가기 버튼도 귀엽게 */
        .back-btn { display: inline-block; margin-top:20px; padding: 10px 20px; background: #5D4037; color: white; border-radius: 15px; text-decoration: none; font-size: 1.2rem;}
    </style>
</head>
<body>
    <div class="card">
        <div class="header-area">
            <img src="rilakkuma.png.jpg" class="lab-master" alt="리락쿠마 연구소장">
            <div>
                <h1 style="margin:0;">🐻 리락쿠마의 신상 과자 영양 연구소</h1>
                <p style="margin:0; color:#8D6E63;">"오늘은 뭘 먹고 쉴까나~? 꼼꼼하게 분석해줄게!"</p>
            </div>
        </div>

        <div class="product-section">
            <img src="h1.jpg" class="product-img" alt="두바이 찰떡파이">
            <h3 style="margin-top:0;">01. 명가 찰떡파이 (두바이식)</h3>
            <table>
                <tr><th>열량</th><td>119 kcal</td><th>지방</th><td>4.5g</td></tr>
                <tr><th>당류</th><td>7g</td><th>단백질</th><td>1.5g</td></tr>
            </table>
            <div class="bar-container"><div class="bar" style="width: 55%;"></div></div>
        </div>

        <div class="product-section">
            <img src="h2.jpg" class="product-img" alt="오예스 우베라떼">
            <h3 style="margin-top:0;">02. 오예스 (우베라떼)</h3>
            <table>
                <tr><th>열량</th><td>135 kcal</td><th>지방</th><td>7g</td></tr>
                <tr><th>당류</th><td>11g</td><th>단백질</th><td>1.8g</td></tr>
            </table>
            <div class="bar-container"><div class="bar" style="width: 70%;"></div></div>
        </div>

        <div class="product-section">
            <img src="h3.jpg" class="product-img" alt="후레쉬베리 펑리수">
            <h3 style="margin-top:0;">03. 후레쉬베리 (펑리수)</h3>
            <table>
                <tr><th>열량</th><td>110 kcal</td><th>지방</th><td>5g</td></tr>
                <tr><th>당류</th><td>9g</td><th>단백질</th><td>1g</td></tr>
            </table>
            <div class="bar-container"><div class="bar" style="width: 45%;"></div></div>
        </div>

        <center><a href="index.html" class="back-btn">← 연구소 메인으로 돌아가기</a></center>
    </div>
</body>
</html>
