    main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 56px; } .location { margin-top: 34px; scroll-margin-top: 130px; } .location h2 { margin: 0 0 12px; font-size: 19px; }

    .metrics { padding: 13px 14px 15px; } .score-row { display: flex; gap: 8px; align-items: baseline; } .score { color: #087737; font-size: 25px; font-weight: 800; } .score-unit { color: #67736b; font-size: 13px; } .metric-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 12px; } .metric { padding: 8px; background: #f5f8f5; border-radius: 4px; } .metric b { display: block; font-size: 12px; color: #56645a; } .metric span { display: block; margin-top: 3px; font-size: 15px; font-weight: 700; } .warning { margin: 12px 0 0; padding: 9px; border-left: 3px solid #efb138; background: #fffaf0; color: #75591a; font-size: 12px; line-height: 1.45; }
