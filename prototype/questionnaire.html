<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사전 질문지 작성</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="form-page">
  <main class="questionnaire-wrap">
    <form class="questionnaire" aria-labelledby="questionnaire-title">
      <header>
        <p class="eyebrow">김OO 멘토, 이OO 멘토에게 면담 신청</p>
        <h1 id="questionnaire-title">사전 질문지</h1>
        <p>이번 달 남은 신청 가능 횟수 2회 / 3회</p>
      </header>

      <label class="form-field">
        <span>1. 자기 소개</span>
        <textarea rows="5" placeholder="학년, 전공, 관심 분야를 간단히 적어주세요."></textarea>
      </label>

      <label class="form-field">
        <span>2. 현재 가장 큰 고민</span>
        <textarea rows="5" placeholder="진로, 연구실, 전공 수업, 대학원 준비 중 가장 궁금한 점을 적어주세요."></textarea>
      </label>

      <label class="form-field">
        <span>3. 면담을 통해 얻고 싶은 것</span>
        <textarea rows="4" placeholder="면담 후 어떤 판단이나 정보를 얻고 싶은지 적어주세요."></textarea>
      </label>

      <label class="form-field">
        <span>4. 희망 면담 시간</span>
        <input type="text" placeholder="예: 화요일 19:00, 금요일 15:00">
      </label>

      <div class="form-actions">
        <a class="secondary-action" href="index.html">돌아가기</a>
        <a class="primary-action" href="application-complete.html">면담 신청</a>
      </div>
    </form>
  </main>
</body>
</html>
