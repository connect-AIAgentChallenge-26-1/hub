global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/placepick-alerts.yml

scrape_configs:
  - job_name: placepick-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - dev:8080
        labels:
          application: placepick-backend
          environment: local
