spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 10000
  flyway:
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL}}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    connect-retries: 6
    connect-retries-interval: 5s
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL}
      connect-timeout: 5s
      timeout: 5s
  mvc:
    log-request-details: false
  task:
    scheduling:
      pool:
        size: ${PLACEPICK_SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: placepick-scheduler-

management:
  metrics:
    tags:
      application: placepick-backend
      environment: production
      role: ${PLACEPICK_ROLE:all}
      release: ${RENDER_GIT_COMMIT}
  tracing:
    sampling:
      probability: ${PLACEPICK_TRACE_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: placepick
      service.version: ${RENDER_GIT_COMMIT}
      deployment.environment: production
      placepick.role: ${PLACEPICK_ROLE:all}
  otlp:
    logging:
      endpoint: ${GRAFANA_OTLP_ENDPOINT}/v1/logs
      headers:
        Authorization: ${GRAFANA_OTLP_AUTHORIZATION}
      connect-timeout: 2s
      timeout: 5s
      compression: gzip
      export:
        enabled: true
    metrics:
      export:
        enabled: true
        url: ${GRAFANA_OTLP_ENDPOINT}/v1/metrics
        headers:
          Authorization: ${GRAFANA_OTLP_AUTHORIZATION}
        connect-timeout: 2s
        read-timeout: 5s
        step: ${PLACEPICK_OTLP_METRICS_STEP:30s}
        base-time-unit: seconds
    tracing:
      endpoint: ${GRAFANA_OTLP_ENDPOINT}/v1/traces
      headers:
        Authorization: ${GRAFANA_OTLP_AUTHORIZATION}
      connect-timeout: 2s
      timeout: 5s
      compression: gzip
      export:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: false
  observations:
    key-values:
      application: placepick-backend
      environment: production
      role: ${PLACEPICK_ROLE:all}
      release: ${RENDER_GIT_COMMIT}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
    json:
      customizer: com.placepick.security.RedactingStructuredLoggingCustomizer
    ecs:
      service:
        name: placepick-backend
        version: ${RENDER_GIT_COMMIT}
        environment: production
  structured.json.stacktrace:
    max-length: 2048
    max-throwable-depth: 12

placepick:
  role: ${PLACEPICK_ROLE:all}
  external:
    mode: ${PLACEPICK_EXTERNAL_MODE:production}
    naver-base-url: https://naverapihub.apigw.ntruss.com
    llm-base-url: ${CHAT_PROXY_URL}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
