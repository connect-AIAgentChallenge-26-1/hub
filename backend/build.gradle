plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Placepick AI backend environment baseline'

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    evalTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    liveEvidenceTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    evalTestImplementation.extendsFrom testImplementation
    evalTestRuntimeOnly.extendsFrom testRuntimeOnly
    liveEvidenceTestImplementation.extendsFrom testImplementation
    liveEvidenceTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.testcontainers:postgresql'
    integrationTestImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}

// Test evidence must be regenerated even though non-Test tasks retain normal up-to-date checks.
tasks.withType(Test).configureEach {
    outputs.upToDateWhen { false }
    // Test suites drive worker/cleanup behavior explicitly so cached Spring contexts cannot keep
    // background schedulers racing another class's database cleanup.
    systemProperty 'placepick.scheduling.enabled', 'false'
}

tasks.named('test') {
    description = 'Runs fast unit tests without Docker.'
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs PostgreSQL, Redis, WireMock, and application integration tests.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

tasks.register('evalTest', Test) {
    group = 'verification'
    description = 'Validates deterministic evaluation fixtures and safety policies.'
    testClassesDirs = sourceSets.evalTest.output.classesDirs
    classpath = sourceSets.evalTest.runtimeClasspath
    shouldRunAfter tasks.named('integrationTest')
}

tasks.register('liveEvidenceTest', Test) {
    group = 'verification'
    description = 'Runs three explicit direct-provider evidence scenarios outside CI.'
    testClassesDirs = sourceSets.liveEvidenceTest.output.classesDirs
    classpath = sourceSets.liveEvidenceTest.runtimeClasspath
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    systemProperty(
        'placepick.live-evidence.enabled',
        providers.systemProperty('placepick.live-evidence.enabled').orElse('false').get()
    )
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('evalTest')
    dependsOn tasks.named('liveEvidenceTestClasses')
    dependsOn tasks.named('bootJar')
}

tasks.named('bootJar') {
    archiveFileName = 'placepick-backend.jar'
}
