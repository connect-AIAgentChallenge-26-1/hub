plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Placepick AI backend environment baseline'

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    evalTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    naverLiveContractTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    llmLiveContractTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    workflowLiveProbeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    workflowLiveLinkedTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    evalTestImplementation.extendsFrom testImplementation
    evalTestRuntimeOnly.extendsFrom testRuntimeOnly
    naverLiveContractTestImplementation.extendsFrom testImplementation
    naverLiveContractTestRuntimeOnly.extendsFrom testRuntimeOnly
    llmLiveContractTestImplementation.extendsFrom testImplementation
    llmLiveContractTestRuntimeOnly.extendsFrom testRuntimeOnly
    workflowLiveProbeTestImplementation.extendsFrom testImplementation
    workflowLiveProbeTestRuntimeOnly.extendsFrom testRuntimeOnly
    workflowLiveLinkedTestImplementation.extendsFrom testImplementation
    workflowLiveLinkedTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.testcontainers:postgresql'
    integrationTestImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}

// Test evidence must be regenerated even though non-Test tasks retain normal up-to-date checks.
tasks.withType(Test).configureEach {
    outputs.upToDateWhen { false }
}

tasks.named('test') {
    description = 'Runs fast unit tests without Docker.'
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs PostgreSQL, Redis, WireMock, and application integration tests.'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

tasks.register('evalTest', Test) {
    group = 'verification'
    description = 'Validates deterministic evaluation fixtures and safety policies.'
    testClassesDirs = sourceSets.evalTest.output.classesDirs
    classpath = sourceSets.evalTest.runtimeClasspath
    shouldRunAfter tasks.named('integrationTest')
}

tasks.register('naverLiveContractTest', Test) {
    group = 'verification'
    description = 'Runs the explicitly enabled, budget-limited NAVER API HUB live contract canary.'
    testClassesDirs = sourceSets.naverLiveContractTest.output.classesDirs
    classpath = sourceSets.naverLiveContractTest.runtimeClasspath
    shouldRunAfter tasks.named('evalTest')
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

tasks.register('llmLiveContractTest', Test) {
    group = 'verification'
    description = 'Runs the explicitly enabled, budget-limited Elice LLM live contract canary.'
    testClassesDirs = sourceSets.llmLiveContractTest.output.classesDirs
    classpath = sourceSets.llmLiveContractTest.runtimeClasspath
    shouldRunAfter tasks.named('evalTest')
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

tasks.register('workflowLiveProbeTest', Test) {
    group = 'verification'
    description = 'Runs the approved four-call split-provider workflow live probe through loopback.'
    testClassesDirs = sourceSets.workflowLiveProbeTest.output.classesDirs
    classpath = sourceSets.workflowLiveProbeTest.runtimeClasspath
    shouldRunAfter tasks.named('evalTest')
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

tasks.register('workflowLiveLinkedTest', Test) {
    group = 'verification'
    description = 'Runs the approved Naver-to-Elice linked workflow through the product core.'
    testClassesDirs = sourceSets.workflowLiveLinkedTest.output.classesDirs
    classpath = sourceSets.workflowLiveLinkedTest.runtimeClasspath
    shouldRunAfter tasks.named('evalTest')
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    useJUnitPlatform {
        includeTags 'live'
    }
}

tasks.register('workflowLiveLinkedContractTest', Test) {
    group = 'verification'
    description = 'Runs secret-free linked workflow scenario and semantic boundary tests.'
    testClassesDirs = sourceSets.workflowLiveLinkedTest.output.classesDirs
    classpath = sourceSets.workflowLiveLinkedTest.runtimeClasspath
    shouldRunAfter tasks.named('evalTest')
    maxParallelForks = 1
    useJUnitPlatform {
        includeTags 'offline'
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('evalTest')
    dependsOn tasks.named('naverLiveContractTestClasses')
    dependsOn tasks.named('llmLiveContractTestClasses')
    dependsOn tasks.named('workflowLiveProbeTestClasses')
    dependsOn tasks.named('workflowLiveLinkedTestClasses')
    dependsOn tasks.named('workflowLiveLinkedContractTest')
    dependsOn tasks.named('bootJar')
}

tasks.named('bootJar') {
    archiveFileName = 'placepick-backend.jar'
}
