[project]
name = "hub-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "passlib[argon2]>=1.7.4",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pip-audit>=2.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
    "types-passlib>=1.7.7.20260211",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-generated migrations are boilerplate the tool writes, not
# hand-authored style surface.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in a default argument is the idiomatic DI
# pattern, not the mutable-default-argument bug this rule targets.
# UP042/UP046: StrEnum/PEP 695 type params are left for a deliberate follow-up
# once Pydantic's generic-model support for the new syntax is verified across
# this codebase, rather than converted opportunistically here.
ignore = ["B008", "UP042", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["passlib.*"]
ignore_missing_imports = true

# Test bodies are still type-checked (check_untyped_defs), but test functions
# are not required to carry full annotations the way app/ code is — pytest
# fixtures as bare params are the idiomatic style here.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
