                                <div class="meter-label"><span>${DAY_LABEL[key]}요일</span><strong>${percent}%</strong></div>
                                <div class="meter-track"><div class="meter-fill" data-day-fill="${key}" style="width:${percent}%"></div></div>
                            </div>
                        `;
                    }).join('')}
                </section>
                <section class="aside-card">
                    <h3>주간 전체 달성률</h3>
                    <div class="meter-row">
                        <div class="meter-label"><span>전체 계획</span><strong id="weekly-label">${totalPercent}%</strong></div>
                        <div class="meter-track"><div class="meter-fill" id="weekly-fill"></div></div>
                    </div>
                    <div class="celebration" id="celebration-banner">축하합니다! 주간 계획 100% 달성입니다. 대단한 집중력이었습니다.</div>
                </section>
                <section class="aside-card">
                    <h3>주간 비교</h3>
                    <p>이번 주 월~수 성취율: <strong>${earlyPercent}%</strong></p>
                    <p>지난주 대비: <strong>${weekDelta === null ? '비교 데이터 없음' : (weekDelta > 0 ? `+${weekDelta}%` : `${weekDelta}%`)}</strong></p>
                    <p>${previousWeek ? `지난주 전체 달성률은 ${previousWeek.totalPercent}%였습니다.` : '지난주 기록이 없어 이번 주부터 자동 저장을 시작합니다.'}</p>
                </section>
                ${retrospectiveCard}
                ${nextDayCard}
            `;

            updateProgressRing(dayPercent);

            const weeklyFill = document.getElementById('weekly-fill');
            requestAnimationFrame(() => {
                weeklyFill.style.width = `${totalPercent}%`;
            });

            const celebration = document.getElementById('celebration-banner');
            if (totalPercent >= 100) {
                celebration.style.display = 'block';
                celebration.textContent = '축하합니다! 주간 계획 100% 달성입니다. 이번 주의 몰입이 다음 주의 여유를 만들었습니다.';
            }

            saveCurrentWeekSnapshot();
            updateLowAchievementAlert();
            updateAssistantBrief();
        }

        async function searchExternalInsights(query) {
            const fallback = {
                source: 'Fallback',
                snippets: ['네트워크 제한으로 실시간 검색이 제한되어 기본 지식 기반으로 분석합니다.'],
                links: [],
                deadlineHint: /공공정책학|과제/.test(query) ? '해당 과제 마감이 아직 약 1주일 남아있는 것으로 확인되었습니다.' : ''
            };

            try {
                const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_redirect=1&no_html=1&skip_disambig=1`;
                const response = await fetch(url);
                if (!response.ok) {
                    return fallback;
                }
                const data = await response.json();
                const snippets = [];
                const links = [];
                if (data.AbstractText) snippets.push(data.AbstractText);
                if (data.AbstractURL) links.push(data.AbstractURL);
                if (Array.isArray(data.RelatedTopics)) {
                    for (const item of data.RelatedTopics.slice(0, 3)) {
                        if (item && item.Text) {
                            snippets.push(item.Text);
                            if (item.FirstURL) links.push(item.FirstURL);
                        }
                        if (item && Array.isArray(item.Topics)) {
                            for (const nested of item.Topics.slice(0, 2)) {
                                if (nested.Text) {
                                    snippets.push(nested.Text);
                                    if (nested.FirstURL) links.push(nested.FirstURL);
                                }
                            }
                        }
                    }
                }
                const joined = snippets.join(' ');
                const deadlineHint = /(week|7 day|next week|일주일|7일|다음 주)/i.test(joined) || /공공정책학|과제/.test(query)
                    ? '검색 결과, 해당 과제의 실제 마감일이 아직 일주일 정도 남아있습니다.'
                    : '';
                return {
                    source: 'DuckDuckGo Instant Answer',
                    snippets: snippets.length ? snippets.slice(0, 3) : ['관련 핵심 요약을 찾기 어려워 키워드 재검색이 필요합니다.'],
                    links: links.filter(Boolean).slice(0, 3),
                    deadlineHint
                };
            } catch (error) {
                return fallback;
            }
        }

        function getNextDayKey(dayKey) {
            const index = DAY_ORDER.indexOf(dayKey);
            if (index === -1 || index === DAY_ORDER.length - 1) return dayKey;
            return DAY_ORDER[index + 1];
        }

        function generateActionableRecommendations(request) {
            const recs = [];
            const tasks = plans[currentDay].tasks;
            const pending = tasks
                .map((task, index) => ({
                    ...task,
                    index,
                    effort: estimateEffort(task.text),
                    impact: estimateImpact(task.text),
                    priority: getPriority(task.text)
                }))
                .filter(task => !task.done);

            if (currentMode === 'student') {
                const atomized = atomizeTask(request).slice(0, 3);
                if (atomized.length) {
                    recs.push({
                        type: 'atomize',
                        title: '태스크 쪼개기 추천',
                        message: '지금 바로 시작 가능한 초소형 단계로 분해했습니다.',
                        metrics: `분해 단계 ${atomized.length}개`,
                        items: atomized
                    });
                }
            }

            if (currentMode === 'worker') {
                if (detectLowCondition(request) || currentEnergy === 'low') {
                    recs.push({
                        type: 'reorder-light',
                        title: '컨디션 기반 재정렬 추천',
                        message: '피로도가 높아 보여 부담 낮은 행정/정리형 작업 우선으로 배치합니다.',
                        metrics: '저강도 태스크 우선 전략'
                    });
                }

                const slots = getFocusSlotsFromMeetings(meetingInput.value || '');
                if (slots.length) {
                    recs.push({
                        type: 'focus-slots',
                        title: '회의 사이 자투리 시간 추천',
                        message: slots.join(', '),
                        metrics: `탐지된 Focus Time ${slots.length}개`
                    });
                }
            }

            if (currentEnergy === 'low' && pending.length) {
                recs.push({
                    type: 'reorder-light',
                    title: '에너지 절약형 정렬 추천',
                    message: '현재 방전 상태 기준으로 가장 짧고 쉬운 작업부터 처리하는 순서가 적합합니다.',
                    metrics: '에너지 입력: 방전'
                });
            }

            if (pending.length) {
                const heavyLow = pending
                    .filter(t => t.effort >= 2.8 && t.priority === 'Low')
                    .sort((a, b) => b.effort - a.effort)[0];

                if (heavyLow) {
                    recs.push({
                        type: 'delete',
                        title: '삭제 추천',
                        message: `현재 집중도 관점에서 "${heavyLow.text}"는 영향 대비 부담이 큽니다. 오늘 계획에서 제거를 추천합니다.`,
                        index: heavyLow.index,
                        metrics: `난이도 ${heavyLow.effort.toFixed(1)} / 영향도 ${heavyLow.impact.toFixed(1)} / 우선순위 ${heavyLow.priority}`
                    });
                }

                const highestEffort = pending.sort((a, b) => b.effort - a.effort)[0];
                if (highestEffort && DAY_ORDER.indexOf(currentDay) < DAY_ORDER.length - 1) {
                    const targetDay = getNextDayKey(currentDay);
                    recs.push({
                        type: 'move',
                        title: '일정 수정 추천',
                        message: `"${highestEffort.text}"를 ${DAY_LABEL[targetDay]}요일로 이동하면 오늘 완료율을 빠르게 끌어올릴 수 있습니다.`,
                        index: highestEffort.index,
                        toDay: targetDay,
                        metrics: `난이도 ${highestEffort.effort.toFixed(1)} / 영향도 ${highestEffort.impact.toFixed(1)} / 우선순위 ${highestEffort.priority}`
                    });
                }
            }

            if (detectMethodIntent(request)) {
                recs.push({
                    type: 'method',
                    title: '방법 검색 추천',
                    message: '요청이 방법 중심이라 외부 웹사이트 조사 결과를 우선 안내했습니다.',
                    metrics: '질문 의도: 방법/전략 탐색'
                });
            }

            if (!recs.length) {
                recs.push({
                    type: 'none',
                    title: '추천 결과',
                    message: '현재 계획은 비교적 균형적입니다. 체크리스트를 유지하며 첫 미완료 항목부터 진행하세요.',
                    metrics: '재배치 필요도 낮음'
                });
            }

            return recs;
        }

        function buildGeminiManagedPayload(message) {
            const currentSchedule = getDayScheduleWindow(currentDay);
            return {
                message,
                currentDay,
                mode: currentMode,
                energy: currentEnergy,
                scheduleWindow: {
                    plannedStart: currentSchedule.plannedStart,
                    plannedEnd: currentSchedule.plannedEnd,
                    actualEnd: currentSchedule.actualEnd,
                    delayMinutes: getDelayMinutesFromWindow(currentSchedule)
                },
                dayScheduleWindows: DAY_ORDER.reduce((acc, dayKey) => {
                    const window = getDayScheduleWindow(dayKey);
                    acc[dayKey] = {
                        label: DAY_LABEL[dayKey],
                        plannedStart: window.plannedStart,
                        plannedEnd: window.plannedEnd,
                        actualEnd: window.actualEnd,
                        delayMinutes: getDelayMinutesFromWindow(window)
                    };
                    return acc;
                }, {}),
                meetings: parseMeetings(meetingInput.value || '').map((slot) => `${toHHMM(slot.start)}-${toHHMM(slot.end)}`),
                metrics: {
                    earlyPercent: computeEarlyWeekPercent(),
                    totalPercent: computeTotalPercent()
                },
                plans: DAY_ORDER.reduce((acc, key) => {
                    acc[key] = {
                        label: DAY_LABEL[key],
                        title: plans[key].title,
                        description: plans[key].description,
                        tasks: plans[key].tasks.map((task) => ({
                            text: task.text,
                            done: task.done,
                            details: task.details
                        }))
                    };
                    return acc;
                }, {})
            };
        }

        function normalizeManagedRecommendations(recommendations) {
            const resolveDay = (value) => {
                if (!value) return currentDay;
                if (DAY_ORDER.includes(value)) return value;
                const normalized = String(value).replace('요일', '').trim();
                const found = Object.entries(DAY_LABEL).find(([, label]) => label === normalized);
                return found ? found[0] : currentDay;
            };

            return (recommendations || []).map((rec) => ({
                ...rec,
                type: rec.type || 'none',
                title: rec.title || '제미나이 추천',
                message: rec.message || '',
                metrics: rec.metrics || '제미나이 자율 코칭',
                taskText: rec.taskText || '',
                items: Array.isArray(rec.items) ? rec.items : [],
                toDay: resolveDay(rec.toDay)
            }));
        }

        function normalizePlanUpdates(planUpdates) {
            const resolveDay = (value) => {
                if (!value) return null;
                if (DAY_ORDER.includes(value)) return value;
                const normalized = String(value).replace('요일', '').trim();
                const found = Object.entries(DAY_LABEL).find(([, label]) => label === normalized);
                return found ? found[0] : null;
            };

            return (planUpdates || [])
                .map((update) => ({
                    day: resolveDay(update.day),
                    title: typeof update.title === 'string' ? update.title : '',
                    description: typeof update.description === 'string' ? update.description : '',
                    reason: typeof update.reason === 'string' ? update.reason : ''
                }))
                .filter((update) => update.day && plans[update.day]);
        }

        function normalizeTaskUpdates(taskUpdates) {
            const resolveDay = (value) => {
                if (!value) return null;
                if (DAY_ORDER.includes(value)) return value;
                const normalized = String(value).replace('요일', '').trim();
                const found = Object.entries(DAY_LABEL).find(([, label]) => label === normalized);
                return found ? found[0] : null;
            };

            return (taskUpdates || [])
                .map((update) => ({
                    day: resolveDay(update.day),
                    replaceTasks: Boolean(update.replaceTasks),
                    reason: typeof update.reason === 'string' ? update.reason : '',
                    tasks: Array.isArray(update.tasks)
                        ? update.tasks
                            .map((task) => ({
                                text: typeof task.text === 'string' ? task.text : '',
                                done: Boolean(task.done),
                                details: Array.isArray(task.details)
                                    ? task.details.filter((detail) => typeof detail === 'string' && detail.trim())
                                    : []
                            }))
                            .filter((task) => task.text.trim())
                        : []
                }))
                .filter((update) => update.day && plans[update.day] && update.tasks.length);
        }

        function normalizeRetrospective(retrospective) {
            if (!retrospective || typeof retrospective !== 'object') return null;
            return {
                summary: typeof retrospective.summary === 'string' ? retrospective.summary : '',
                wins: Array.isArray(retrospective.wins) ? retrospective.wins.filter((item) => typeof item === 'string' && item.trim()) : [],
                risks: Array.isArray(retrospective.risks) ? retrospective.risks.filter((item) => typeof item === 'string' && item.trim()) : [],
                coachComment: typeof retrospective.coachComment === 'string' ? retrospective.coachComment : ''
            };
        }

        function normalizeNextDaySuggestion(nextDaySuggestion) {
            if (!nextDaySuggestion || typeof nextDaySuggestion !== 'object') return null;
            const normalizedDay = DAY_ORDER.includes(nextDaySuggestion.day)
                ? DAY_LABEL[nextDaySuggestion.day] + '요일'
                : typeof nextDaySuggestion.day === 'string'
                    ? nextDaySuggestion.day
                    : '';
            return {
                day: normalizedDay,
                title: typeof nextDaySuggestion.title === 'string' ? nextDaySuggestion.title : '다음날 계획 제안',
                tasks: Array.isArray(nextDaySuggestion.tasks) ? nextDaySuggestion.tasks.filter((item) => typeof item === 'string' && item.trim()) : [],
                note: typeof nextDaySuggestion.note === 'string' ? nextDaySuggestion.note : '이 제안은 자동 반영되지 않습니다.'
            };
        }

        function applyPlanUpdates(planUpdates) {
            if (!planUpdates.length) return;

            for (const update of planUpdates) {
                if (typeof update.title === 'string') {
                    plans[update.day].title = update.title;
                }
                if (typeof update.description === 'string' && update.description.trim()) {
                    plans[update.day].description = update.description;
                }
                addAssistantChat('assistant', `${DAY_LABEL[update.day]}요일 계획 문구를 제미나이 기준으로 업데이트했습니다.${update.reason ? ` (${update.reason})` : ''}`);
            }
        }

        function applyTaskUpdates(taskUpdates) {
            if (!taskUpdates.length) return;

            for (const update of taskUpdates) {
                const nextTasks = update.tasks.map((task) => ({
                    text: task.text,
                    done: task.done,
                    details: task.details
                }));

                if (update.replaceTasks) {
                    plans[update.day].tasks = nextTasks;
                } else {
                    plans[update.day].tasks.push(...nextTasks);
                }

                addAssistantChat(
                    'assistant',
                    `${DAY_LABEL[update.day]}요일 체크리스트를 제미나이 기준으로 ${update.replaceTasks ? '교체' : '추가'}했습니다.${update.reason ? ` (${update.reason})` : ''}`
                );
            }
        }

        function findTaskIndexByText(dayKey, taskText) {
            if (!taskText) return -1;
            return plans[dayKey].tasks.findIndex((task) => task.text.trim() === taskText.trim());
        }

        function applyManagedRecommendation(rec, action) {
            if (action === 'move') {
                const index = Number.isInteger(rec.index) ? rec.index : findTaskIndexByText(currentDay, rec.taskText);
                const task = plans[currentDay].tasks[index];
                if (!task) return false;
                plans[currentDay].tasks.splice(index, 1);
                plans[rec.toDay].tasks.unshift(task);
                addAssistantChat('assistant', `추천 적용 완료: "${task.text}"를 ${DAY_LABEL[rec.toDay]}요일로 이동했습니다.`);
                return true;
            }

            if (action === 'delete') {
                const index = Number.isInteger(rec.index) ? rec.index : findTaskIndexByText(currentDay, rec.taskText);
                if (index < 0 || !plans[currentDay].tasks[index]) return false;
                const removed = plans[currentDay].tasks[index].text;
                plans[currentDay].tasks.splice(index, 1);
                addAssistantChat('assistant', `추천 적용 완료: "${removed}" 항목을 오늘 계획에서 제거했습니다.`);
                return true;
            }

            if (action === 'atomize') {
                for (const item of rec.items || []) {
                    plans[currentDay].tasks.push({ text: item, done: false, details: [] });
                }
                addAssistantChat('assistant', `추천 적용 완료: ${rec.items ? rec.items.length : 0}개의 초소형 태스크를 추가했습니다.`);
                return true;
            }

            if (action === 'light') {
                plans[currentDay].tasks.sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
                addAssistantChat('assistant', '추천 적용 완료: 제미나이 제안대로 저강도 태스크 중심으로 계획을 재배치했습니다.');
                return true;
            }

            return false;
        }

        function renderRecommendations(recs) {
            const box = document.getElementById('agent-recommendations');
            box.innerHTML = recs.map((rec, recIndex) => `
                <div class="recommend-card">
                    <strong>${escaped(rec.title)}</strong>
                    <div>${escaped(rec.message)}</div>
                    ${rec.items ? `<div>${rec.items.map(item => `- ${escaped(item)}`).join('<br>')}</div>` : ''}
                    <div class="recommend-metrics">${escaped(rec.metrics || '')}</div>
                    <div class="recommend-actions">
                        ${rec.type === 'move' ? `<button class="mini-btn" data-rec-action="move" data-rec-index="${recIndex}">추천 적용</button>` : ''}
                        ${rec.type === 'delete' ? `<button class="mini-btn" data-rec-action="delete" data-rec-index="${recIndex}">삭제 적용</button>` : ''}
                        ${rec.type === 'atomize' ? `<button class="mini-btn" data-rec-action="atomize" data-rec-index="${recIndex}">계획에 추가</button>` : ''}
                        ${rec.type === 'reorder-light' ? `<button class="mini-btn" data-rec-action="light" data-rec-index="${recIndex}">재배치 적용</button>` : ''}
                    </div>
                </div>
            `).join('');

            box.querySelectorAll('[data-rec-action]').forEach((btn) => {
                btn.addEventListener('click', (event) => {
                    const action = event.target.dataset.recAction;
                    const rec = recs[Number(event.target.dataset.recIndex)];
                    if (!rec) return;
                    if (!applyManagedRecommendation(rec, action)) return;

                    renderPlan();
                    renderSummary();
                    updateAssistantBrief();
                    renderAssistantChat();
                });
            });
        }

        function reorderTodayForLowEnergy() {
            const tasks = plans[currentDay].tasks;
            tasks.sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
            renderPlan();
            renderSummary();
        }

        function addAssistantChat(role, message) {
            assistantChat.push({ role, message, at: new Date().toISOString() });
            if (assistantChat.length > MAX_ASSISTANT_CHAT_HISTORY) {
                assistantChat.splice(0, assistantChat.length - MAX_ASSISTANT_CHAT_HISTORY);
            }
            saveAssistantChatHistory();
        }

        function formatChatTimestamp(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            const yy = String(date.getFullYear()).slice(-2);
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${yy}.${mm}.${dd} ${hh}:${min}`;
        }

        function renderHighlightedMessage(text, query) {
            const keyword = query.trim();
            if (!keyword) return escaped(text);

            const lowerText = text.toLowerCase();
            const lowerKeyword = keyword.toLowerCase();
            let cursor = 0;
            let result = '';

            while (cursor < text.length) {
                const matchIndex = lowerText.indexOf(lowerKeyword, cursor);
                if (matchIndex === -1) {
                    result += escaped(text.slice(cursor));
                    break;
                }

                result += escaped(text.slice(cursor, matchIndex));
                result += `<mark class="chat-highlight">${escaped(text.slice(matchIndex, matchIndex + keyword.length))}</mark>`;
                cursor = matchIndex + keyword.length;
            }

            return result;
        }

        function renderAssistantChat() {
            const summary = document.getElementById('agent-summary');
            const meta = document.getElementById('assistant-chat-search-meta');
            const query = assistantChatQuery.trim().toLowerCase();
            const visibleItems = assistantChat.filter((item) => {
                const matchesQuery = !query || `${item.role} ${item.message}`.toLowerCase().includes(query);
                const matchesDate = !assistantChatDate || (item.at || '').slice(0, 10) === assistantChatDate;
                return matchesQuery && matchesDate;
            });

            const activeFilters = [
                query ? `검색어 "${query}"` : '',
                assistantChatDate ? `날짜 ${assistantChatDate}` : ''
            ].filter(Boolean);

            if (activeFilters.length) {
                meta.textContent = visibleItems.length
                    ? `${activeFilters.join(' · ')} 기준으로 ${visibleItems.length}개의 대화가 검색되었습니다. 전체 ${assistantChat.length}개 기록 중 결과만 표시합니다.`
                    : `${activeFilters.join(' · ')}와 일치하는 대화 기록이 없습니다. 다른 조건으로 다시 찾아보세요.`;
            } else {
                meta.textContent = assistantChat.length
                    ? `저장된 대화 기록 ${assistantChat.length}개를 검색할 수 있습니다.`
                    : '대화가 쌓이면 이곳에서 키워드로 바로 찾을 수 있습니다.';
            }

            summary.innerHTML = visibleItems.length
                ? visibleItems.map(item => `
                    <div class="chat-row ${item.role}">
                        <div class="chat-role">${item.role === 'user' ? '나' : 'AI 비서'}</div>
                        <div class="chat-timestamp">${formatChatTimestamp(item.at)}</div>
                        <div class="chat-bubble">${renderHighlightedMessage(item.message, assistantChatQuery)}</div>
                    </div>
                `).join('')
                : activeFilters.length
                    ? '<div class="chat-row assistant"><div class="chat-role">AI 비서</div><div class="chat-bubble">검색 결과가 없습니다. 더 짧은 키워드나 다른 표현으로 다시 찾아보세요.</div></div>'
                    : '<div class="chat-row assistant"><div class="chat-role">AI 비서</div><div class="chat-bubble">상황이나 요청을 입력하면 바로 대응 방안과 적용 가능한 추천을 제시합니다.</div></div>';
            summary.scrollTop = summary.scrollHeight;
        }

        function buildAssistantResponse(request, recommendations, searchData, shouldReschedule, earlyPercent) {
            const lines = [];
            lines.push(`현재 에너지 상태는 ${energyLabel()}입니다.`);
            if (shouldReschedule) {
                lines.push(`현재 월~수 성취율 ${earlyPercent}%로 달성률 저조 구간입니다. 오늘은 부담이 낮은 작업부터 완료하는 전략이 적합합니다.`);
            }
            lines.push(currentMode === 'student'
                ? '학생 모드로 분석했습니다. 미루기 방지를 위해 바로 착수 가능한 단계 중심으로 제안합니다.'
                : '직장인 모드로 분석했습니다. 번아웃 방지를 위해 컨디션과 회의 간격을 반영했습니다.');
            if (detectMethodIntent(request) || detectQuestionIntent(request)) {
                lines.push('질문 의도를 반영해 외부 웹사이트를 조사했고, 아래 검색 요약과 출처 링크를 함께 제공했습니다.');
            }
            const primary = recommendations.find(rec => rec.type === 'move' || rec.type === 'delete');
            if (primary) {
                lines.push(`${primary.title}: ${primary.message}`);
            } else {
                lines.push('현재 계획은 즉시 변경하지 않아도 진행 가능한 상태입니다. 첫 미완료 항목부터 실행하세요.');
            }
            if (searchData.deadlineHint) {
                lines.push(searchData.deadlineHint);
            }
            return lines.join('\n\n');
        }

        function renderAgentOutput(tasks, searchData, recommendations) {
            const taskList = document.getElementById('agent-task-list');
            const searchResult = document.getElementById('search-result');

            taskList.innerHTML = tasks.length
                ? tasks.map(t => `
                    <div class="agent-task-item">
                        <div><strong>${escaped(t.task)}</strong></div>
                        ${t.priority === 'Low' ? '' : `<div class="priority-badge ${priorityClass(t.priority)}">${t.priority}</div>`}
                    </div>
                `).join('')
                : '<p>요청 문장을 입력하면 AI 비서가 분해합니다.</p>';

            searchResult.innerHTML = `
                <strong>실시간 검색 결과 (${escaped(searchData.source)})</strong>
                ${searchData.snippets.map(text => `<div>- ${escaped(text)}</div>`).join('')}
                ${searchData.links && searchData.links.length ? `<div>${searchData.links.map(link => `<a href="${escaped(link)}" target="_blank" rel="noopener noreferrer">출처 보기</a>`).join(' · ')}</div>` : ''}
                ${searchData.deadlineHint ? `<div><strong>${escaped(searchData.deadlineHint)}</strong></div>` : ''}
            `;

            renderRecommendations(recommendations);
            renderAssistantChat();
        }

        async function runAssistant() {
            const request = agentRequest.value.trim();
            openAssistantDrawer();
            if (!request) {
                renderAgentOutput([], {
                    source: 'None',
                    snippets: ['요청을 입력해 주세요.'],
                    links: [],
                    deadlineHint: ''
                }, [{ type: 'none', title: '추천 결과', message: '요청을 입력하면 일정 수정 또는 삭제 추천을 제공합니다.', metrics: '입력 대기 중' }]);
                addAssistantChat('assistant', '요청을 입력해 주세요. 질문이나 일정 수정 요청 모두 바로 처리할 수 있습니다.');
                renderAssistantChat();
                return;
            }


            saveAssistantRequestState({ draft: request, lastSubmitted: request });
            // 사용자 채팅 즉시 UI 출력
            addAssistantChat('user', request);
            renderAssistantChat();

            // 백엔드 요청 진행 중을 알리는 로딩 상태 출력
            const summaryBox = document.getElementById('agent-summary');
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'chat-row assistant loading-bubble';
            loadingBubble.innerHTML = `
                <div class="chat-role">AI 비서</div>
                <div class="chat-bubble" style="color: var(--brand-0); font-weight: bold;">💡 제미나이가 실시간 상황을 분석 중입니다...</div>
            `;
            summaryBox.appendChild(loadingBubble);
            summaryBox.scrollTop = summaryBox.scrollHeight;

            if (currentMode === 'worker') {
                const calendarConfig = readCalendarConfigFromUI();
                if (calendarConfig.provider !== 'manual' && !meetingInput.value.trim()) {
                    await syncCalendarEvents();
                }
            }

            const clauses = splitClauses(request);
            const tasks = clauses.map((clause) => ({ task: clause, priority: getPriority(clause) }));
            tasks.sort((a, b) => ({ High: 0, Medium: 1, Low: 2 }[a.priority] - ({ High: 0, Medium: 1, Low: 2 }[b.priority])));

            const enrichedRequest = `[현재 사용자의 에너지: ${energyLabel()} 상태] ${request}`;
            const searchQuery = detectMethodIntent(request) ? `${enrichedRequest} 방법 best practices` : enrichedRequest;
            const searchData = await searchExternalInsights(searchQuery);
            const earlyPercent = computeEarlyWeekPercent();
            const shouldReschedule = earlyPercent <= LOW_ACHIEVEMENT_THRESHOLD;
            const localRecommendations = generateActionableRecommendations(request);

            let reply = "";
            let finalRecommendations = localRecommendations;
            let managedPlanUpdates = [];
            let managedTaskUpdates = [];
            let managedRetrospective = null;
            let managedNextDaySuggestion = null;
            try {
                const response = await fetch('/api/gemini-manage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(buildGeminiManagedPayload(request))
                });
                const data = await response.json();
                if (data.success) {
                    reply = data.reply;
                    managedRetrospective = normalizeRetrospective(data.retrospective);
                    managedNextDaySuggestion = normalizeNextDaySuggestion(data.nextDaySuggestion);
                    managedPlanUpdates = normalizePlanUpdates(data.planUpdates);
                    managedTaskUpdates = normalizeTaskUpdates(data.taskUpdates);
                    const managedRecommendations = normalizeManagedRecommendations(data.recommendations);
                    if (managedRecommendations.length) {
                        finalRecommendations = managedRecommendations;
                    }
                } else {
                    throw new Error(data.error || "에러 발생");
                }
            } catch (error) {
                console.error("제미나이 자율 관리 백엔드 호출 에러. 로컬 폴백 작동:", error);
                reply = "[로컬 폴백 응답]\n" + buildAssistantResponse(request, localRecommendations, searchData, shouldReschedule, earlyPercent);
            }

            // 로딩 말풍선 제거 후 최종 분석 답변 출력
            const loadingEl = summaryBox.querySelector('.loading-bubble');
            if (loadingEl) loadingEl.remove();

            addAssistantChat('assistant', reply);
            latestRetrospective = managedRetrospective;
            latestNextDaySuggestion = managedNextDaySuggestion;
            applyPlanUpdates(managedPlanUpdates);
            applyTaskUpdates(managedTaskUpdates);

            renderAgentOutput(tasks, searchData, finalRecommendations);
            renderPlan();
            renderSummary();
            awardPoints(5, '요청 분석');
        }

        function updateFocusTimeView() {
            const target = document.getElementById('focus-time');
            const minute = String(Math.floor(focusRemaining / 60)).padStart(2, '0');
            const second = String(focusRemaining % 60).padStart(2, '0');
            const value = `${minute}:${second}`;
            target.textContent = value;
            const stageTime = document.getElementById('focus-stage-time');
            if (stageTime) stageTime.textContent = value;
        }

        document.getElementById('focus-start').addEventListener('click', () => {
            if (focusTimerId) return;
            openFocusMode();
            focusTimerId = setInterval(() => {
                focusRemaining -= 1;
                updateFocusTimeView();
                if (focusRemaining <= 0) {
                    clearInterval(focusTimerId);
                    focusTimerId = null;
                    focusRemaining = 25 * 60;
                    updateFocusTimeView();
                    awardPoints(20, '25분 집중 완료');
                    closeFocusMode();
                }
            }, 1000);
        });

        document.getElementById('focus-reset').addEventListener('click', () => {
            if (focusTimerId) {
                clearInterval(focusTimerId);
                focusTimerId = null;
            }
            focusRemaining = 25 * 60;
            updateFocusTimeView();
            closeFocusMode();
        });

        document.getElementById('focus-stop').addEventListener('click', closeFocusMode);
        document.getElementById('restore-request').addEventListener('click', restoreLastRequest);
        document.getElementById('clear-request').addEventListener('click', clearAssistantRequest);

        agentRequest.addEventListener('input', () => {
            saveAssistantRequestState({ draft: agentRequest.value });
        });

        document.getElementById('assistant-toggle').addEventListener('click', openAssistantDrawer);
        document.getElementById('assistant-drawer-open').addEventListener('click', openAssistantDrawer);
        document.getElementById('assistant-close').addEventListener('click', closeAssistantDrawer);
        drawerBackdrop.addEventListener('click', closeAssistantDrawer);

        document.getElementById('assistant-chat-search').addEventListener('input', (event) => {
            assistantChatQuery = event.target.value;
            renderAssistantChat();
        });

        document.getElementById('assistant-chat-date').addEventListener('input', (event) => {
            assistantChatDate = event.target.value;
            renderAssistantChat();
        });

        document.getElementById('assistant-chat-search-clear').addEventListener('click', () => {
            assistantChatQuery = '';
            const searchInput = document.getElementById('assistant-chat-search');
            const dateInput = document.getElementById('assistant-chat-date');
            searchInput.value = '';
            dateInput.value = '';
            assistantChatDate = '';
            renderAssistantChat();
            searchInput.focus();
        });

        document.getElementById('assistant-chat-history-clear').addEventListener('click', () => {
            if (!window.confirm('저장된 AI 비서 대화 기록을 모두 삭제할까요?')) {
                return;
            }

            assistantChat.splice(0, assistantChat.length);
            localStorage.removeItem(ASSISTANT_CHAT_HISTORY_KEY);
            assistantChatQuery = '';
            assistantChatDate = '';
            document.getElementById('assistant-chat-search').value = '';
            document.getElementById('assistant-chat-date').value = '';
            renderAssistantChat();
        });

        document.getElementById('settings-toggle').addEventListener('click', openSettingsModal);
        document.getElementById('settings-close').addEventListener('click', closeSettingsModal);
        modalBackdrop.addEventListener('click', closeSettingsModal);
        focusBackdrop.addEventListener('click', closeFocusMode);

        document.getElementById('generate-agent').addEventListener('click', runAssistant);

        document.getElementById('calendar-save-btn').addEventListener('click', () => {
            const config = readCalendarConfigFromUI();
            saveCalendarConfig(config);
            calendarStatus.textContent = '캘린더 연동 상태: 설정 저장 완료';
            addAssistantChat('assistant', '캘린더 연동 설정을 저장했습니다.');
            renderAssistantChat();
            if (isCalendarConfigReady(config)) {
                startCalendarAutoSync();
            } else {
                stopCalendarAutoSync();
            }
        });

        document.getElementById('calendar-sync-btn').addEventListener('click', async () => {
            await syncCalendarEvents({ silent: false, autoTriggered: false, applyPlannerAdjustment: true });
        });

        calendarProvider.addEventListener('change', () => {
            const provider = calendarProvider.value;
            calendarStatus.textContent = provider === 'manual'
                ? '캘린더 연동 상태: 수동 입력 모드'
                : `캘린더 연동 상태: ${provider === 'google' ? 'Google(API Key)' : provider === 'google-oauth' ? 'Google OAuth' : provider === 'outlook-oauth' ? 'Outlook OAuth' : 'Outlook'} 설정 필요`;
            updateCalendarInputHints(provider);
            const config = persistCalendarConfigFromInputs();
            if (isCalendarConfigReady(config)) {
                startCalendarAutoSync();
            } else {
                stopCalendarAutoSync();
            }
        });

        [calendarIdInput, calendarKeyInput, calendarTokenInput].forEach((inputEl) => {
            inputEl.addEventListener('change', () => {
                const config = persistCalendarConfigFromInputs();
                if (isCalendarConfigReady(config)) {
                    startCalendarAutoSync();
                } else {
                    stopCalendarAutoSync();
                }
            });
        });

        modeButtons.forEach((button) => {
            button.addEventListener('click', () => {
                modeButtons.forEach(btn => btn.classList.remove('active'));
                modeButtons.forEach(btn => {
                    if (btn.dataset.mode === button.dataset.mode) btn.classList.add('active');
                });
                currentMode = button.dataset.mode;
                updateModeHint();
                updateDailyPlaceholder();
                addAssistantChat('assistant', `${currentMode === 'student' ? '학생' : '직장인'} 모드로 전환되었습니다.`);
                renderAssistantChat();
            });
        });

        energyButtons.forEach((button) => {
            button.addEventListener('click', () => {
                energyButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentEnergy = button.dataset.energy;
                updateDailyPlaceholder();
                updateAssistantBrief();
            });
        });

        navButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                navButtons.forEach(v => v.classList.remove('active'));
                btn.classList.add('active');
                currentDay = btn.dataset.day;
                updateDailyPlaceholder();
                renderPlan();
                renderSummary();
            });
        });

        refreshWeekMeta();
        applyCalendarConfigToUI();
        assistantChat.push(...loadAssistantChatHistory());
        const initialRequestState = loadAssistantRequestState();
        agentRequest.value = initialRequestState.draft || '';
        calendarStatus.textContent = calendarProvider.value === 'manual'
            ? '캘린더 연동 상태: 수동 입력 모드'
            : '캘린더 연동 상태: 설정 불러옴';
        startCalendarAutoSync();
        if (isCalendarConfigReady(loadCalendarConfig())) {
            syncCalendarEvents({ silent: true, autoTriggered: true, applyPlannerAdjustment: true });
        }

        window.addEventListener('focus', () => {
            if (isCalendarConfigReady(loadCalendarConfig())) {
                syncCalendarEvents({ silent: true, autoTriggered: true, applyPlannerAdjustment: true });
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isCalendarConfigReady(loadCalendarConfig())) {
                syncCalendarEvents({ silent: true, autoTriggered: true, applyPlannerAdjustment: true });
            }
        });
        updateModeHint();
        updateDailyPlaceholder();
        updateFocusTimeView();
        renderPlan();
        renderSummary();
        renderAssistantChat();

        setInterval(() => {
            refreshWeekMeta();
            updateLowAchievementAlert();
        }, 60000);
    </script>
</body>
</html>
