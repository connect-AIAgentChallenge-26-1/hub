<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 계획 실행 에이전트</title>
    <style>
        :root {
            --bg-0: #f2f6f8;
            --bg-1: #e8f0f4;
            --ink-0: #0f1720;
            --ink-1: #233747;
            --ink-2: #456175;
            --brand-0: #0e7490;
            --brand-1: #059669;
            --brand-2: #f59e0b;
            --soft-card: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(15, 23, 32, 0.12);
            --danger: #dc2626;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink-0);
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(14, 116, 144, 0.16), transparent 40%),
                radial-gradient(circle at 80% 12%, rgba(245, 158, 11, 0.18), transparent 45%),
                linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 42%, #f7f9fa 100%);
        }

        .hero {
            padding: 52px 20px 34px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(2rem, 3.5vw, 3rem);
            letter-spacing: 0.02em;
            color: #0b1c2b;
        }

        .hero p {
            max-width: 900px;
            margin: 14px auto 0;
            color: var(--ink-1);
            line-height: 1.75;
            font-size: 0.95rem;
        }

        .schedule {
            max-width: 1220px;
            margin: 0 auto 38px;
            padding: 0 18px 24px;
        }

        .meta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #0b3a4b;
            background: linear-gradient(90deg, rgba(14, 116, 144, 0.16), rgba(5, 150, 105, 0.18));
            border: 1px solid rgba(5, 150, 105, 0.2);
        }

        .nav {
            margin: 18px 0 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .top-action-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .icon-btn {
            border: 1px solid rgba(14, 116, 144, 0.24);
            background: rgba(255, 255, 255, 0.88);
            color: #0e3d53;
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .energy-strip {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0 0 22px;
        }

        .energy-btn {
            border: 1px solid rgba(15, 23, 32, 0.12);
            background: rgba(255,255,255,0.88);
            border-radius: 999px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            color: #244555;
        }

        .energy-btn.active {
            background: linear-gradient(90deg, #0e7490, #22c55e);
            color: #fff;
            border-color: transparent;
        }

        .day-button {
            border: 1px solid rgba(14, 116, 144, 0.22);
            border-radius: 999px;
            padding: 12px 18px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.84);
            color: #0c3348;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .day-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(14, 116, 144, 0.18);
        }

        .day-button.active {
            color: #ffffff;
            border-color: transparent;
            background: linear-gradient(90deg, var(--brand-0), var(--brand-1));
            box-shadow: 0 10px 24px rgba(5, 150, 105, 0.32);
        }

        .panel,
        .aside-card {
            border: 1px solid var(--glass-border);
            background: var(--soft-card);
            backdrop-filter: blur(8px);
            border-radius: 24px;
        }

        .drawer-backdrop,
        .modal-backdrop,
        .focus-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(7, 18, 26, 0.44);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 30;
        }

        .drawer-backdrop.open,
        .modal-backdrop.open,
        .focus-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .assistant-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: min(460px, 100vw);
            height: 100vh;
            z-index: 40;
            background: rgba(245, 249, 250, 0.96);
            backdrop-filter: blur(14px);
            border-left: 1px solid rgba(15, 23, 32, 0.1);
            box-shadow: -20px 0 50px rgba(15, 23, 42, 0.14);
            padding: 22px;
            transform: translateX(100%);
            transition: transform 0.28s ease;
            overflow: auto;
        }

        .assistant-drawer.open { transform: translateX(0); }

        .settings-modal {
            position: fixed;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -48%) scale(0.98);
            width: min(760px, calc(100vw - 28px));
            max-height: calc(100vh - 40px);
            overflow: auto;
            z-index: 41;
            background: rgba(247, 251, 252, 0.98);
            border: 1px solid rgba(15,23,32,0.12);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(15,23,42,0.22);
            padding: 22px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .settings-modal.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-head,
        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .close-btn {
            border: none;
            background: rgba(14, 116, 144, 0.12);
            color: #0e3c53;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
        }

        .agent-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 14px;
            align-items: start;
        }

        .agent-head h3 {
            margin: 0;
            color: #0a2435;
            font-size: 1.18rem;
        }

        .daily-motivation {
            margin-top: 8px;
            color: var(--ink-2);
            font-size: 0.93rem;
        }

        .chat-search-panel {
            margin-top: 14px;
            padding: 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(15, 23, 32, 0.08);
            display: grid;
            gap: 8px;
        }

        .chat-search-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .chat-search-tools {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .chat-search-input {
            width: 100%;
            border: 1px solid rgba(14, 116, 144, 0.18);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 14px;
            font-size: 0.92rem;
            color: #123247;
        }

        .chat-date-input {
            width: 100%;
            border: 1px solid rgba(14, 116, 144, 0.18);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 12px;
            font-size: 0.9rem;
            color: #123247;
        }

        .chat-search-meta {
            font-size: 0.82rem;
            color: #4d697b;
            line-height: 1.5;
        }

        .chat-timestamp {
            font-size: 0.75rem;
            color: #6a8394;
        }

        .chat-highlight {
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.28), rgba(14, 116, 144, 0.16));
            color: #0f2230;
            padding: 0 2px;
            border-radius: 4px;
        }

        .danger-btn {
            border: 1px solid rgba(220, 38, 38, 0.18);
            background: rgba(220, 38, 38, 0.08);
            color: #991b1b;
        }

        .assistant-drawer textarea,
        .settings-modal textarea {
            width: 100%;
            min-height: 94px;
            margin-top: 12px;
            border-radius: 16px;
            border: 1px solid rgba(14, 116, 144, 0.25);
            background: rgba(255, 255, 255, 0.94);
            padding: 12px 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            color: #0f2230;
        }

        .agent-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .agent-actions.secondary {
            margin-top: 8px;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .mode-btn {
            border: 1px solid rgba(14, 116, 144, 0.24);
            background: rgba(255, 255, 255, 0.86);
            color: #104761;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
        }

        .mode-btn.active {
            color: #ffffff;
            border-color: transparent;
            background: linear-gradient(90deg, #0e7490, #059669);
        }

        .mode-hint {
            margin-top: 8px;
            font-size: 0.86rem;
            color: #395a6d;
            line-height: 1.6;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover { transform: translateY(-1px); }

        .btn.primary {
            color: #fff;
            background: linear-gradient(90deg, #0e7490, #0284c7);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
        }

        .btn.ghost {
            background: rgba(14, 116, 144, 0.1);
            color: #0d4059;
            border: 1px solid rgba(14, 116, 144, 0.24);
        }

        .agent-task-list { margin-top: 14px; }

        .agent-task-item {
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(14, 116, 144, 0.14);
            margin-bottom: 10px;
        }

        .priority-badge {
            margin-top: 8px;
            display: inline-flex;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.84rem;
            font-weight: 700;
        }

        .priority-high { background: rgba(220, 38, 38, 0.14); color: #991b1b; }
        .priority-medium { background: rgba(14, 116, 144, 0.14); color: #0f4f64; }
        .priority-low { background: rgba(5, 150, 105, 0.14); color: #065f46; }

        .agent-summary {
            margin-top: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 23, 32, 0.1);
            padding: 14px;
            color: #163041;
            max-height: 260px;
            overflow: auto;
        }

        .chat-row {
            display: grid;
            gap: 4px;
            margin-bottom: 10px;
        }

        .chat-role {
            font-size: 0.78rem;
            font-weight: 700;
            color: #3a5f74;
        }

        .chat-bubble {
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .chat-row.user .chat-bubble {
            background: rgba(14, 116, 144, 0.12);
            border: 1px solid rgba(14, 116, 144, 0.2);
        }

        .chat-row.assistant .chat-bubble {
            background: rgba(5, 150, 105, 0.1);
            border: 1px solid rgba(5, 150, 105, 0.2);
        }

        .layout {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 18px;
            align-items: start;
        }

        .panel {
            padding: 24px;
            min-height: 420px;
        }

        .editable-title,
        .editable-description,
        .task-text,
        .detail-input {
            outline: none;
        }

        .editable-title {
            margin: 0;
            color: #11293a;
            border-radius: 12px;
            padding: 4px 8px;
        }

        .editable-description {
            margin: 10px 0 0;
            color: #2b4453;
            padding: 8px;
            border-radius: 12px;
            min-height: 42px;
        }

        .editable-title:focus,
        .editable-description:focus,
        .task-text:focus,
        .detail-input:focus {
            background: rgba(2, 132, 199, 0.08);
            box-shadow: inset 0 0 0 1px rgba(2, 132, 199, 0.28);
        }

        .task-list {
            list-style: none;
            margin: 16px 0 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }

        .task-item {
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(14, 116, 144, 0.16);
            background: rgba(255, 255, 255, 0.85);
        }

        .task-main {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: start;
        }

        .task-main input[type="checkbox"] {
            width: 19px;
            height: 19px;
            margin-top: 4px;
            accent-color: #0e7490;
        }

        .task-text {
            min-height: 24px;
            border-radius: 10px;
            padding: 4px 6px;
            color: #162c3b;
            line-height: 1.5;
        }

        .task-tools {
            display: flex;
            gap: 6px;
        }

        .mini-btn {
            border: 1px solid rgba(15, 23, 32, 0.18);
            background: #fff;
            border-radius: 10px;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 0.82rem;
        }

        .details {
            margin: 8px 0 0 28px;
            display: grid;
            gap: 6px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
        }

        .detail-input {
            border: 1px solid rgba(14, 116, 144, 0.18);
            border-radius: 10px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.95);
            color: #153346;
            width: 100%;
        }

        .panel-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .summary-aside {
            display: grid;
            gap: 14px;
        }

        .aside-card {
            padding: 18px;
        }

        .aside-card h3 { margin: 0 0 10px; color: #153144; }
        .aside-card p { margin: 0; line-height: 1.6; color: #37566a; }

        .ring-wrap {
            display: grid;
            place-items: center;
            margin: 6px 0 10px;
        }

        .ring {
            position: relative;
            width: 126px;
            height: 126px;
        }

        .ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring .track {
            fill: none;
            stroke: rgba(14, 116, 144, 0.15);
            stroke-width: 12;
        }

        .ring .value {
            fill: none;
            stroke: url(#ringGradient);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 0 999;
            transition: stroke-dasharray 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ring-center {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f2b3c;
        }

        .meter-row {
            margin-top: 8px;
            display: grid;
            gap: 8px;
        }

        .meter-track {
            height: 12px;
            background: rgba(14, 116, 144, 0.14);
            border-radius: 999px;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #0891b2, #059669 55%, #f59e0b);
            transition: width 1.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .meter-label {
            font-size: 0.86rem;
            color: #35566a;
            display: flex;
            justify-content: space-between;
        }

        .celebration {
            margin-top: 10px;
            border-radius: 12px;
            padding: 10px 12px;
            background: rgba(5, 150, 105, 0.12);
            border: 1px solid rgba(5, 150, 105, 0.24);
            color: #065f46;
            display: none;
        }

        .crisis {
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--danger);
            font-weight: 700;
        }

        .search-result {
            margin-top: 8px;
            display: grid;
            gap: 6px;
            font-size: 0.9rem;
            color: #29506a;
        }

        .search-result a {
            color: #0e7490;
            text-decoration: none;
            border-bottom: 1px dashed rgba(14, 116, 144, 0.4);
        }

        .recommendation-list {
            margin-top: 10px;
            display: grid;
            gap: 10px;
        }

        .recommend-card {
            border: 1px solid rgba(15, 23, 32, 0.12);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 10px 12px;
            color: #1b3b4f;
        }

        .recommend-card strong {
            display: block;
            margin-bottom: 4px;
        }

        .recommend-metrics {
            margin-top: 6px;
            font-size: 0.82rem;
            color: #4a6a7d;
        }

        .recommend-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .assistant-brief {
            margin-top: 10px;
            border-radius: 12px;
            padding: 10px 12px;
            background: rgba(14, 116, 144, 0.08);
            border: 1px solid rgba(14, 116, 144, 0.2);
            color: #144158;
            line-height: 1.65;
            font-size: 0.9rem;
        }

        .focus-lab {
            margin-top: 10px;
            border-radius: 12px;
            border: 1px solid rgba(14, 116, 144, 0.18);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px;
            display: grid;
            gap: 8px;
        }

        .focus-time {
            font-size: 1.05rem;
            font-weight: 800;
            color: #0e3c53;
        }

        .focus-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meeting-input {
            margin-top: 8px;
            width: 100%;
            border: 1px solid rgba(14, 116, 144, 0.22);
            border-radius: 10px;
            padding: 8px;
            min-height: 72px;
            resize: vertical;
        }

        .mini-focus-card {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.88);
            border: 1px solid rgba(14, 116, 144, 0.14);
            display: grid;
            gap: 10px;
        }

        .assistant-compose {
            margin-bottom: 18px;
            padding: 22px;
            border-radius: 28px;
            border: 1px solid rgba(14, 116, 144, 0.12);
            background:
                radial-gradient(circle at top right, rgba(14, 116, 144, 0.08), transparent 32%),
                linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,251,252,0.92));
            box-shadow: 0 22px 44px rgba(15, 23, 42, 0.08);
        }

        .assistant-compose h3 {
            margin: 0 0 8px;
            color: #123247;
            font-size: 1.3rem;
            letter-spacing: 0.01em;
        }

        .assistant-compose p {
            margin: 0;
            color: #4b6677;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .assistant-compose textarea {
            width: 100%;
            min-height: 132px;
            margin-top: 14px;
            border-radius: 20px;
            border: 1px solid rgba(14, 116, 144, 0.16);
            background: rgba(255,255,255,0.98);
            padding: 16px 18px;
            font-size: 0.98rem;
            line-height: 1.7;
            color: #102636;
            resize: vertical;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .assistant-compose .mode-switch {
            margin-top: 14px;
        }

        .assistant-compose .agent-actions {
            margin-top: 14px;
        }

        .assistant-compose .btn.primary {
            min-width: 174px;
        }

        .assistant-compose .btn.ghost {
            background: rgba(255,255,255,0.86);
            border: 1px solid rgba(14, 116, 144, 0.16);
        }

        .day-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .day-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            padding: 10px 14px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(14, 116, 144, 0.14), rgba(5, 150, 105, 0.16));
            color: #0f3c52;
            font-size: 1.05rem;
            font-weight: 800;
        }

        .plan-title-input {
            flex: 1;
            min-width: 220px;
            border: 1px solid rgba(14, 116, 144, 0.14);
            background: rgba(255,255,255,0.65);
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 1.6rem;
            font-weight: 800;
            color: #11293a;
        }

        .task-quick-add {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin: 14px 0 18px;
        }

        .task-quick-add input {
            border: 1px solid rgba(14, 116, 144, 0.22);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.96);
            color: #153346;
        }

        .schedule-window-card {
            margin: 14px 0;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(14, 116, 144, 0.18);
            background: rgba(255, 255, 255, 0.78);
            display: grid;
            gap: 10px;
        }

        .schedule-window-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;

            const today = new Date().toISOString().slice(0, 10);
            if (profile.lastActiveDate === today) return profile;
            if (!profile.lastActiveDate) {
                profile.streak = 1;
            } else {
                const prev = new Date(profile.lastActiveDate + 'T00:00:00');
                const now = new Date(today + 'T00:00:00');
                const diff = Math.round((now - prev) / 86400000);
                profile.streak = diff === 1 ? profile.streak + 1 : 1;
            }
            profile.lastActiveDate = today;
            return profile;

        function isValidTimeLabel(value) {
            if (typeof value !== 'string') return false;
            const match = value.match(/^(\d{2}):(\d{2})$/);
            if (!match) return false;
            const hh = Number(match[1]);
            const mm = Number(match[2]);
            return hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59;
        }

        function hhmmToMinutes(value) {
            if (!isValidTimeLabel(value)) return null;
            const [hh, mm] = value.split(':').map(Number);
            return hh * 60 + mm;

                return DAY_ORDER.reduce((acc, dayKey) => {
                    acc[dayKey] = getDefaultDayScheduleWindow();
                    return acc;
                }, {});
            }
        }

        function saveDayScheduleWindows() {
            localStorage.setItem(DAY_SCHEDULE_WINDOW_KEY, JSON.stringify(dayScheduleWindows));
        }

        function getDayScheduleWindow(dayKey) {
            if (!dayScheduleWindows[dayKey]) {
                dayScheduleWindows[dayKey] = getDefaultDayScheduleWindow();
            }
            return dayScheduleWindows[dayKey];
        }

        function setDayScheduleWindow(dayKey, nextWindow) {
            dayScheduleWindows[dayKey] = normalizeDayScheduleWindow(nextWindow);
            saveDayScheduleWindows();
            return dayScheduleWindows[dayKey];
        }

        function getDelayMinutesFromWindow(scheduleWindow) {
            const plannedEnd = hhmmToMinutes(scheduleWindow?.plannedEnd || '');
            const actualEnd = hhmmToMinutes(scheduleWindow?.actualEnd || '');
            if (plannedEnd === null || actualEnd === null) return 0;
            return Math.max(0, actualEnd - plannedEnd);
        }

        function getScheduleWindowStatusText(dayKey) {
            const scheduleWindow = getDayScheduleWindow(dayKey);
            const plannedStart = scheduleWindow.plannedStart;
            const plannedEnd = scheduleWindow.plannedEnd;
            const delayMinutes = getDelayMinutesFromWindow(scheduleWindow);

            if (!scheduleWindow.actualEnd) {
                return `예상 실행 시간창: ${plannedStart}-${plannedEnd}. 실제 종료 시각 입력 시 지연 자동 조율이 동작합니다.`;
            }

            if (delayMinutes <= 0) {
                return `실제 종료 ${scheduleWindow.actualEnd}. 계획한 종료 시각(${plannedEnd})을 지켰습니다.`;
            }

            return `실제 종료 ${scheduleWindow.actualEnd}. 예상 종료 대비 ${delayMinutes}분 지연되었습니다.`;
        }

        function renderScheduleWindowStatus(dayKey) {
            if (dayKey !== currentDay) return;
            const note = document.getElementById('schedule-window-note');
            if (!note) return;
            note.textContent = getScheduleWindowStatusText(dayKey);
        }

        function getCurrentTimeLabel() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        function buildDelayFallbackSuggestion(dayKey, delayMinutes, endShiftMinutes) {
            const pending = plans[dayKey].tasks.filter((task) => !task.done);
            if (!pending.length) {
                return `${DAY_LABEL[dayKey]}요일은 미완료 작업이 없어 지연 조정 없이 마감해도 됩니다.`;
            }

            const easyFirst = [...pending].sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
            const hardFirst = [...pending].sort((a, b) => estimateEffort(b.text) - estimateEffort(a.text));
            const nextDay = getNextDayKey(dayKey);
            const lines = [
                `자동 제안(지연 대응):`,
                `1) 지금 바로 끝낼 작업: ${easyFirst[0]?.text || '짧은 확인 작업 1개'}`,
                `2) 묶어서 처리할 작업: ${easyFirst.slice(1, 3).map((task) => task.text).join(' / ') || '잔여 작업 2개'}`,
                `3) 내일 이월 후보: ${nextDay ? (hardFirst[0]?.text || '고난도 작업 1개') : '이번 주 내 가능한 작업으로 축소'}`,
                `${delayMinutes > 0 ? `예상 대비 ${delayMinutes}분 지연이므로` : `종료 시각이 ${endShiftMinutes}분 늦춰졌으므로`} 오늘은 완료 기준을 "핵심 1개 + 경량 1개"로 낮추세요.`
            ];
            return lines.join('\n');
        }

        function applyCalendarConfigToUI() {
            const config = loadCalendarConfig();
            calendarProvider.value = config.provider;
            calendarIdInput.value = config.calendarId;
            calendarKeyInput.value = config.apiKey;
            calendarTokenInput.value = config.token;
            updateCalendarInputHints(config.provider);
        }

        function readCalendarConfigFromUI() {
            return {
                provider: calendarProvider.value,
                calendarId: calendarIdInput.value.trim(),
                apiKey: calendarKeyInput.value.trim(),
                token: calendarTokenInput.value.trim()
            };
        }

        function isCalendarConfigReady(config) {
            if (!config || config.provider === 'manual') return false;
            if (config.provider === 'google') {
                return Boolean(config.calendarId && config.apiKey);
            }
            if (config.provider === 'google-oauth') {
                return Boolean(config.calendarId && config.token);
            }
            if (config.provider === 'outlook-oauth') {
                return Boolean(config.token);
            }
            if (config.provider === 'outlook') {
                return Boolean(config.token);
            }
            return false;
        }

        function updateCalendarInputHints(provider) {
            if (provider === 'google') {
                calendarKeyInput.placeholder = 'Google API Key (구글 공개 캘린더 사용 시)';
                calendarTokenInput.placeholder = '사용 안 함 (Google 공개 캘린더 모드)';
                return;
            }

            if (provider === 'google-oauth') {
                calendarKeyInput.placeholder = '사용 안 함 (Google OAuth 모드)';
                calendarTokenInput.placeholder = 'Google Refresh Token (비공개 캘린더)';
                return;
            }

            if (provider === 'outlook') {
                calendarKeyInput.placeholder = 'Outlook Refresh Token (선택: 만료 시 자동 갱신)';
                calendarTokenInput.placeholder = 'Outlook Access Token (아웃룩 사용 시)';
                return;
            }

            if (provider === 'outlook-oauth') {
                calendarKeyInput.placeholder = '사용 안 함 (Outlook OAuth 모드)';
                calendarTokenInput.placeholder = 'Outlook Refresh Token (자동 갱신)';
                return;
            }

            calendarKeyInput.placeholder = 'Google API Key (구글 공개 캘린더 사용 시)';
            calendarTokenInput.placeholder = 'Google/Outlook Refresh Token 또는 Access Token';
        }

        function persistCalendarConfigFromInputs() {
            const config = readCalendarConfigFromUI();
            saveCalendarConfig(config);
            return config;
        }

        function toLocalTimeLabel(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return null;
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        async function fetchGoogleCalendarEvents(config) {
            if (!config.calendarId || !config.apiKey) {
                throw new Error('Google Calendar ID와 API Key가 필요합니다.');
            }
            const timeMin = new Date();
            timeMin.setHours(0, 0, 0, 0);
            const timeMax = new Date(timeMin);
            timeMax.setDate(timeMax.getDate() + 1);
            const endpoint = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events?singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}&key=${encodeURIComponent(config.apiKey)}`;
            const response = await fetch(endpoint);
            if (!response.ok) {
                throw new Error(`Google Calendar 요청 실패 (${response.status})`);
            }
            const payload = await response.json();
            const items = Array.isArray(payload.items) ? payload.items : [];
            return items.map((event) => {
                const startRaw = event.start?.dateTime || event.start?.date;
                const endRaw = event.end?.dateTime || event.end?.date;
                const start = toLocalTimeLabel(startRaw);
                const end = toLocalTimeLabel(endRaw);
                if (!start || !end) return null;
                return `${start}-${end} ${event.summary || '회의'}`;
            }).filter(Boolean);
        }

        async function fetchGoogleOAuthCalendarEvents(config) {
            if (!config.calendarId || !config.token) {
                throw new Error('Google OAuth 모드는 Calendar ID와 Refresh Token이 필요합니다.');
            }

            const response = await fetch('/api/calendar/google-oauth/events', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    calendarId: config.calendarId,
                    refreshToken: config.token
                })
            });

            const payload = await response.json();
            if (!response.ok || !payload.success) {
                throw new Error(payload.error || `Google OAuth 일정 동기화 실패 (${response.status})`);
            }

            return Array.isArray(payload.lines) ? payload.lines : [];
        }

        async function fetchOutlookCalendarEvents(config) {
            if (!config.token) {
                throw new Error('Outlook Access Token이 필요합니다.');
            }
            const start = new Date();
            start.setHours(0, 0, 0, 0);
            const end = new Date(start);
            end.setDate(end.getDate() + 1);
            const endpoint = `https://graph.microsoft.com/v1.0/me/calendarview?startDateTime=${encodeURIComponent(start.toISOString())}&endDateTime=${encodeURIComponent(end.toISOString())}&$orderby=start/dateTime`;
            const response = await fetch(endpoint, {
                headers: {
                    Authorization: `Bearer ${config.token}`,
                    Prefer: 'outlook.timezone="Asia/Seoul"'
                }
            });
            if (!response.ok) {
                if ((response.status === 401 || response.status === 403) && config.apiKey) {
                    const fallback = await fetchOutlookOAuthCalendarEvents({ token: config.apiKey }, { includeAccessToken: true });
                    if (fallback.accessToken) {
                        config.token = fallback.accessToken;
                        saveCalendarConfig(config);
                        if (calendarProvider.value === 'outlook') {
                            calendarTokenInput.value = fallback.accessToken;
                        }
                    }
                    return fallback.lines;
                }
                throw new Error(`Outlook Calendar 요청 실패 (${response.status})`);
            }
            const payload = await response.json();
            const events = Array.isArray(payload.value) ? payload.value : [];
            return events.map((event) => {
                const startText = event.start?.dateTime;
                const endText = event.end?.dateTime;
                const startLabel = startText ? toLocalTimeLabel(startText) : null;
                const endLabel = endText ? toLocalTimeLabel(endText) : null;
                if (!startLabel || !endLabel) return null;
                return `${startLabel}-${endLabel} ${event.subject || '회의'}`;
            }).filter(Boolean);
        }

        async function fetchOutlookOAuthCalendarEvents(config, options = {}) {
            const { includeAccessToken = false } = options;
            if (!config.token) {
                throw new Error('Outlook OAuth 모드는 Refresh Token이 필요합니다.');
            }

            const response = await fetch('/api/calendar/outlook-oauth/events', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    refreshToken: config.token
                })
            });

            const payload = await response.json();
            if (!response.ok || !payload.success) {
                throw new Error(payload.error || `Outlook OAuth 일정 동기화 실패 (${response.status})`);
            }

            const lines = Array.isArray(payload.lines) ? payload.lines : [];
            if (includeAccessToken) {
                return {
                    lines,
                    accessToken: typeof payload.accessToken === 'string' ? payload.accessToken : ''
                };
            }

            return lines;
        }

        async function syncCalendarEvents(options = {}) {
            const {
                silent = false,
                autoTriggered = false,
                applyPlannerAdjustment = true
            } = options;
            const config = persistCalendarConfigFromInputs();
            if (config.provider === 'manual') {
                calendarStatus.textContent = '캘린더 연동 상태: 수동 입력 모드';
                if (!silent) {
                    addAssistantChat('assistant', '수동 입력 모드입니다. 아래 회의 입력 칸에 시간을 직접 입력해 주세요.');
                    renderAssistantChat();
                }
                return;
            }

            if (!isCalendarConfigReady(config)) {
                calendarStatus.textContent = '캘린더 연동 상태: 설정값이 부족합니다.';
                if (!silent) {
                    addAssistantChat('assistant', '캘린더 자동 동기화를 위해 필수 설정값을 먼저 입력해 주세요.');
                    renderAssistantChat();
                }
                return;
            }

            calendarStatus.textContent = autoTriggered
                ? '캘린더 연동 상태: 자동 동기화 중...'
                : '캘린더 연동 상태: 불러오는 중...';
            try {
                const lines = config.provider === 'google'
                    ? await fetchGoogleCalendarEvents(config)
                    : config.provider === 'google-oauth'
                        ? await fetchGoogleOAuthCalendarEvents(config)
                        : config.provider === 'outlook-oauth'
                            ? await fetchOutlookOAuthCalendarEvents(config)
                            : await fetchOutlookCalendarEvents(config);

                const signature = JSON.stringify(lines);
                const changed = signature !== lastCalendarSignature;
                lastCalendarSignature = signature;

                if (!lines.length) {
                    calendarStatus.textContent = '캘린더 연동 상태: 오늘 일정이 없습니다.';
                    if (!silent) {
                        addAssistantChat('assistant', '오늘 캘린더 일정이 없어 회의 기반 Focus Time 추천은 생략합니다.');
                        renderAssistantChat();
                    }
                    return;
                }

                meetingInput.value = lines.join('\n');
                calendarStatus.textContent = `캘린더 연동 상태: ${lines.length}개 일정 반영 완료`;

                if (changed && applyPlannerAdjustment) {
                    autoAdjustPlannerByCalendar(lines, autoTriggered ? '자동' : '수동');
                    renderPlan();
                    renderSummary();
                }

                if (!silent) {
                    addAssistantChat('assistant', `캘린더 연동 완료: 오늘 일정 ${lines.length}개를 회의 입력란에 반영했습니다.${changed ? ' 변경사항을 기준으로 플래너를 자동 조율했습니다.' : ' 기존과 동일해 플래너는 유지했습니다.'}`);
                    renderAssistantChat();
                }
            } catch (error) {
                calendarStatus.textContent = `캘린더 연동 상태: 실패 (${error.message})`;
                if (!silent) {
                    addAssistantChat('assistant', `캘린더 연동 실패: ${error.message}`);
                    renderAssistantChat();
                }
            }
        }

        function splitClauses(text) {
            return text
                .split(/[.!?;]+|\b그리고\b|\b및\b|\band\b|,/)
                .map(v => v.trim())
                .filter(Boolean);
        }

        function escaped(text) {
            return text
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');
        }

        function estimateEffort(taskText) {
            const easyKeywords = ['확인', '정리', '점검', '메모', '연결', '체크'];
            const hardKeywords = ['설계', '고도화', '알고리즘', '리팩토링', '검증', '자료 조사', '제출'];
            let score = 2;
            for (const k of easyKeywords) {
                if (taskText.includes(k)) score -= 0.5;
            }
            for (const k of hardKeywords) {
                if (taskText.includes(k)) score += 0.8;
            }
            return Math.max(1, Math.min(3.5, score));
        }

        function detectMethodIntent(text) {
            return /(방법|어떻게|노하우|전략|팁|guide|how|best practice|해결)/i.test(text);
        }

        function detectQuestionIntent(text) {
            return /(\?|무엇|왜|어떻게|가능할까|추천해|알려줘|찾아줘)/i.test(text);
        }

        function detectLowCondition(text) {
            return /(피곤|지침|번아웃|야근|컨디션|힘들|지쳤)/i.test(text);
        }

        function energyLabel() {
            return currentEnergy === 'high' ? '최상' : currentEnergy === 'mid' ? '보통' : '방전';
        }

        function estimateImpact(taskText) {
            const highImpactKeywords = ['마감', '제출', '핵심', '오류', '장애', '검증'];
            const lowImpactKeywords = ['정리', '기록', '메모'];
            let score = 2.2;
            for (const k of highImpactKeywords) {
                if (taskText.includes(k)) score += 0.8;
            }
            for (const k of lowImpactKeywords) {
                if (taskText.includes(k)) score -= 0.4;
            }
            return Math.max(1, Math.min(5, Number(score.toFixed(1))));
        }

        function atomizeTask(text) {
            const cleaned = text.replace(/[.!?]/g, '').trim();
            if (!cleaned) return [];
            return [
                `${cleaned} 관련 자료/범위 정리 (15분)`,
                `${cleaned} 핵심 실행 1차 (25분)`,
                `${cleaned} 결과 점검 및 마무리 (15분)`
            ];
        }

        function parseMeetings(raw) {
            return raw
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean)
                .map(line => {
                    const match = line.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
                    if (!match) return null;
                    const start = Number(match[1]) * 60 + Number(match[2]);
                    const end = Number(match[3]) * 60 + Number(match[4]);
                    return end > start ? { start, end } : null;
                })
                .filter(Boolean)
                .sort((a, b) => a.start - b.start);
        }

        function toHHMM(minutes) {
            const h = String(Math.floor(minutes / 60)).padStart(2, '0');
            const m = String(minutes % 60).padStart(2, '0');
            return `${h}:${m}`;
        }

        function getTotalMeetingMinutesFromLines(lines) {
            const meetings = parseMeetings((lines || []).join('\n'));
            return meetings.reduce((sum, slot) => sum + (slot.end - slot.start), 0);
        }

        function getMaxFocusGapMinutesFromLines(lines) {
            const slots = getFocusSlotsFromMeetings((lines || []).join('\n'));
            if (!slots.length) return 0;
            let max = 0;
            for (const slot of slots) {
                const match = slot.match(/(\d{2}):(\d{2})-(\d{2}):(\d{2})/);
                if (!match) continue;
                const start = Number(match[1]) * 60 + Number(match[2]);
                const end = Number(match[3]) * 60 + Number(match[4]);
                max = Math.max(max, end - start);
            }
            return max;
        }

        function autoAdjustPlannerByCalendar(lines, sourceLabel) {
            const meetingMinutes = getTotalMeetingMinutesFromLines(lines);
            const maxFocusGap = getMaxFocusGapMinutesFromLines(lines);
            const pending = plans[currentDay].tasks
                .map((task, index) => ({ ...task, index, effort: estimateEffort(task.text) }))
                .filter((task) => !task.done);

            if (!pending.length) return;

            const isHeavyMeetingDay = meetingMinutes >= 240 || maxFocusGap < 45;
            const hasNextDay = DAY_ORDER.indexOf(currentDay) < DAY_ORDER.length - 1;

            if (isHeavyMeetingDay && hasNextDay) {
                const heavyTask = pending.sort((a, b) => b.effort - a.effort)[0];
                if (heavyTask) {
                    const nextDay = getNextDayKey(currentDay);
                    const movedTask = plans[currentDay].tasks.splice(heavyTask.index, 1)[0];
                    plans[nextDay].tasks.unshift(movedTask);
                    addAssistantChat('assistant', `${sourceLabel} 동기화 기준으로 회의량이 많아 "${movedTask.text}"를 ${DAY_LABEL[nextDay]}요일로 자동 조율했습니다.`);
                    plans[currentDay].tasks.sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
                    return;
                }
            }

            plans[currentDay].tasks.sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
            addAssistantChat('assistant', `${sourceLabel} 동기화 기준으로 오늘 작업을 가벼운 순서로 자동 재정렬했습니다.`);
        }

        function autoAdjustPlannerByDelay(dayKey, delayMinutes, endShiftMinutes, triggerReason) {
            const pending = plans[dayKey].tasks
                .map((task, index) => ({ ...task, index, effort: estimateEffort(task.text) }))
                .filter((task) => !task.done);

            if (!pending.length) {
                addAssistantChat('assistant', `${DAY_LABEL[dayKey]}요일은 완료되지 않은 작업이 없어 지연 조정 없이 마감 가능합니다.`);
                return;
            }

            const hasNextDay = DAY_ORDER.indexOf(dayKey) < DAY_ORDER.length - 1;
            const triggerLabel = triggerReason === 'end-shift' ? '종료 시각 지연 감지' : '실제 종료 지연 감지';
            const shouldMoveHeavy = (delayMinutes >= 60 || endShiftMinutes >= 45) && hasNextDay;

            if (shouldMoveHeavy) {
                const heavyTask = pending.sort((a, b) => b.effort - a.effort)[0];
                if (heavyTask) {
                    const nextDay = getNextDayKey(dayKey);
                    const movedTask = plans[dayKey].tasks.splice(heavyTask.index, 1)[0];
                    plans[nextDay].tasks.unshift(movedTask);
                    plans[dayKey].tasks.sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
                    addAssistantChat('assistant', `${triggerLabel}로 "${movedTask.text}"를 ${DAY_LABEL[nextDay]}요일로 자동 이월했고, 오늘 작업은 가벼운 순서로 재정렬했습니다.`);
                    return;
                }
            }

            plans[dayKey].tasks.sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
            addAssistantChat('assistant', `${triggerLabel}로 오늘 미완료 작업을 가벼운 순서로 자동 재정렬했습니다.`);
        }

        async function requestDelayAiSuggestion(dayKey, triggerReason, delayMinutes, endShiftMinutes) {
            const scheduleWindow = getDayScheduleWindow(dayKey);
            const reasonText = delayMinutes > 0
                ? `실제 종료가 예상 종료보다 ${delayMinutes}분 늦어졌습니다.`
                : `예상 종료 시각이 ${endShiftMinutes}분 늦춰졌습니다.`;
            const requestMessage = `${DAY_LABEL[dayKey]}요일 실행 시간창은 ${scheduleWindow.plannedStart}-${scheduleWindow.plannedEnd}이고 실제 종료는 ${scheduleWindow.actualEnd || '미기록'}입니다. ${reasonText} 남은 작업 기준으로 지금 할 일 3개 우선순위, 과감히 줄일 일 1개, 내일 이월할 일 1개를 제안하고 필요한 체크리스트 변경안을 JSON 계획 업데이트로 함께 제시해줘.`;

            try {
                const response = await fetch('/api/gemini-manage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(buildGeminiManagedPayload(requestMessage))
                });
                const payload = await response.json();
                if (!response.ok || !payload.success) {
                    throw new Error(payload.error || `지연 대응 AI 제안 실패 (${response.status})`);
                }

                const managedPlanUpdates = normalizePlanUpdates(payload.planUpdates);
                const managedTaskUpdates = normalizeTaskUpdates(payload.taskUpdates);
                const managedRecommendations = normalizeManagedRecommendations(payload.recommendations);

                applyPlanUpdates(managedPlanUpdates);
                applyTaskUpdates(managedTaskUpdates);

                if (managedRecommendations.length) {
                    const top = managedRecommendations.slice(0, 3)
                        .map((rec, index) => `${index + 1}. ${rec.title}: ${rec.message}`)
                        .join('\n');
                    addAssistantChat('assistant', `지연 대응 AI 제안:\n${top}`);
                } else {
                    addAssistantChat('assistant', buildDelayFallbackSuggestion(dayKey, delayMinutes, endShiftMinutes));

        async function runDelayAwareAdjustment(dayKey, triggerReason, options = {}) {
            const scheduleWindow = getDayScheduleWindow(dayKey);
            const delayMinutes = getDelayMinutesFromWindow(scheduleWindow);
            const endShiftMinutes = Number(options.endShiftMinutes || 0);
            const reactByDelay = delayMinutes >= DELAY_ALERT_THRESHOLD_MINUTES;
            const reactByShift = endShiftMinutes >= SUDDEN_END_SHIFT_THRESHOLD_MINUTES;
            const shouldRun = options.force || reactByDelay || reactByShift;
            if (!shouldRun) {
                renderScheduleWindowStatus(dayKey);
                return;
            }

            const signature = `${triggerReason}|${scheduleWindow.plannedStart}|${scheduleWindow.plannedEnd}|${scheduleWindow.actualEnd}|${Math.floor(delayMinutes / 5)}|${Math.floor(endShiftMinutes / 5)}`;
            if (!options.force && scheduleWindow.lastHandledSignature === signature) {
                return;
            }
            if (delayAutoAdjustRunning) return;

            delayAutoAdjustRunning = true;
            try {
                autoAdjustPlannerByDelay(dayKey, delayMinutes, endShiftMinutes, triggerReason);
                setDayScheduleWindow(dayKey, {
                    ...scheduleWindow,
                    lastHandledSignature: signature
                });
                renderPlan();
                renderSummary();
                renderAssistantChat();
                await requestDelayAiSuggestion(dayKey, triggerReason, delayMinutes, endShiftMinutes);
                renderPlan();
                renderSummary();
                renderAssistantChat();
            } finally {
                delayAutoAdjustRunning = false;
            }
        }

        function getFocusSlotsFromMeetings(raw) {
            const meetings = parseMeetings(raw);
            const dayStart = 9 * 60;
            const dayEnd = 18 * 60;
            const gaps = [];
            let cursor = dayStart;
            for (const meeting of meetings) {
                if (meeting.start - cursor >= 25) {
                    gaps.push({ start: cursor, end: meeting.start });
                }
                cursor = Math.max(cursor, meeting.end);
            }
            if (dayEnd - cursor >= 25) {
                gaps.push({ start: cursor, end: dayEnd });
            }
            return gaps.slice(0, 3).map(g => `${toHHMM(g.start)}-${toHHMM(g.end)} Focus Time`);
        }

        function getPriority(text) {
            const high = ['긴급', '마감', '즉시', '중요', '필수', '장애', '오류'];
            const medium = ['검증', '테스트', '구현', '점검', '작성'];
            let score = 0;
            for (const k of high) {
                if (text.includes(k)) score += 2.4;
            }
            for (const k of medium) {
                if (text.includes(k)) score += 1.2;
            }
            if (text.length > 22) score += 0.6;
            if (score >= 3.2) return 'High';
            if (score >= 1.8) return 'Medium';
            return 'Low';
        }

            const all = DAY_ORDER.flatMap(key => plans[key].tasks);
            if (!all.length) return 0;
            const done = all.filter(t => t.done).length;

        function computeEarlyWeekPercent() {
            const earlyDays = ['mon', 'tue', 'wed'];
            const all = earlyDays.flatMap(key => plans[key].tasks);
            if (!all.length) return 0;
            const done = all.filter(t => t.done).length;
            return Math.round((done / all.length) * 100);

        function getWeekStart(date) {
            const copy = new Date(date);
            const day = copy.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            copy.setDate(copy.getDate() + diff);
            copy.setHours(0, 0, 0, 0);
            return copy;
        }

        function formatDateLabel(date) {

        }

        function getWeekKey(date) {
            const start = getWeekStart(date);
            const year = start.getFullYear();
            const firstWeekStart = getWeekStart(new Date(year, 0, 4));
            const diff = Math.round((start - firstWeekStart) / 86400000);
            const weekNo = Math.floor(diff / 7) + 1;
            return `${year}-W${String(weekNo).padStart(2, '0')}`;
        }

            const now = new Date();

            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 4);

            meta.textContent = `${formatDateLabel(weekStart)} - ${formatDateLabel(weekEnd)} · Weekly Execution Window`;

            history[key] = {

            const currentStart = getWeekStart(new Date());

        function updateProgressRing(percent) {
            const valuePath = document.querySelector('.ring .value');
            const label = document.querySelector('[data-ring-label]');
            if (!valuePath || !label) return;
            const radius = 46;
            const circumference = Math.PI * 2 * radius;
            const dash = (circumference * percent) / 100;
            valuePath.style.strokeDasharray = `${dash} ${circumference}`;

            const start = Number(label.dataset.current || 0);
            const diff = percent - start;
            const duration = 650;
            let startTime = null;

            function tick(time) {
                if (!startTime) startTime = time;
                const p = Math.min(1, (time - startTime) / duration);
                const eased = 1 - Math.pow(1 - p, 3);
                const value = Math.round(start + diff * eased);
                label.textContent = `${value}%`;
                if (p < 1) {
                    window.requestAnimationFrame(tick);
                } else {
                    label.dataset.current = String(percent);
                }
            }

            window.requestAnimationFrame(tick);
        }
