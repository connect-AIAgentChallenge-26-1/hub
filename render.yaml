services:
  - type: web
    runtime: docker
    name: placepick-backend
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PLACEPICK_EXTERNAL_MODE
        value: production
      - key: PLACEPICK_ROLE
        value: all
      - key: COOKIE_SECURE
        value: "true"
      - key: OPENAI_MODEL
        value: openai/gpt-4.1-mini
      - key: APP_PUBLIC_ORIGIN
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_FLYWAY_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_URL
        sync: false
      - key: NAVER_API_HUB_KEY_ID
        sync: false
      - key: NAVER_API_HUB_KEY
        sync: false
      - key: PROXY_TOKEN
        sync: false
      - key: CHAT_PROXY_URL
        sync: false
