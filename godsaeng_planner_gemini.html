<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 계획 실행 에이전트</title>
    <style>
        :root {
            --bg-0: #f2f6f8;
            --bg-1: #e8f0f4;
            --ink-0: #0f1720;
            --ink-1: #233747;
            --ink-2: #456175;
            --brand-0: #0e7490;
            --brand-1: #059669;
            --brand-2: #f59e0b;
            --soft-card: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(15, 23, 32, 0.12);
            --danger: #dc2626;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink-0);
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(14, 116, 144, 0.16), transparent 40%),
                radial-gradient(circle at 80% 12%, rgba(245, 158, 11, 0.18), transparent 45%),
                linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 42%, #f7f9fa 100%);
        }

        .hero {
            padding: 52px 20px 34px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(2rem, 3.5vw, 3rem);
            letter-spacing: 0.02em;
            color: #0b1c2b;
        }

        .hero p {
            max-width: 900px;
            margin: 14px auto 0;
            color: var(--ink-1);
            line-height: 1.75;
            font-size: 0.95rem;
        }

        .schedule {
            max-width: 1220px;
            margin: 0 auto 38px;
            padding: 0 18px 24px;
        }

        .meta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #0b3a4b;
            background: linear-gradient(90deg, rgba(14, 116, 144, 0.16), rgba(5, 150, 105, 0.18));
            border: 1px solid rgba(5, 150, 105, 0.2);
        }

        .nav {
            margin: 18px 0 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .top-action-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .icon-btn {
            border: 1px solid rgba(14, 116, 144, 0.24);
            background: rgba(255, 255, 255, 0.88);
            color: #0e3d53;
            border-radius: 999px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .energy-strip {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0 0 22px;
        }

        .energy-btn {
            border: 1px solid rgba(15, 23, 32, 0.12);
            background: rgba(255,255,255,0.88);
            border-radius: 999px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            color: #244555;
        }

        .energy-btn.active {
            background: linear-gradient(90deg, #0e7490, #22c55e);
            color: #fff;
            border-color: transparent;
        }

        .day-button {
            border: 1px solid rgba(14, 116, 144, 0.22);
            border-radius: 999px;
            padding: 12px 18px;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.84);
            color: #0c3348;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .day-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(14, 116, 144, 0.18);
        }

        .day-button.active {
            color: #ffffff;
            border-color: transparent;
            background: linear-gradient(90deg, var(--brand-0), var(--brand-1));
            box-shadow: 0 10px 24px rgba(5, 150, 105, 0.32);
        }

        .panel,
        .aside-card {
            border: 1px solid var(--glass-border);
            background: var(--soft-card);
            backdrop-filter: blur(8px);
            border-radius: 24px;
        }

        .drawer-backdrop,
        .modal-backdrop,
        .focus-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(7, 18, 26, 0.44);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 30;
        }

        .drawer-backdrop.open,
        .modal-backdrop.open,
        .focus-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .assistant-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: min(460px, 100vw);
            height: 100vh;
            z-index: 40;
            background: rgba(245, 249, 250, 0.96);
            backdrop-filter: blur(14px);
            border-left: 1px solid rgba(15, 23, 32, 0.1);
            box-shadow: -20px 0 50px rgba(15, 23, 42, 0.14);
            padding: 22px;
            transform: translateX(100%);
            transition: transform 0.28s ease;
            overflow: auto;
        }

        .assistant-drawer.open { transform: translateX(0); }

        .settings-modal {
            position: fixed;
            inset: 50% auto auto 50%;
            transform: translate(-50%, -48%) scale(0.98);
            width: min(760px, calc(100vw - 28px));
            max-height: calc(100vh - 40px);
            overflow: auto;
            z-index: 41;
            background: rgba(247, 251, 252, 0.98);
            border: 1px solid rgba(15,23,32,0.12);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(15,23,42,0.22);
            padding: 22px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .settings-modal.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-head,
        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .close-btn {
            border: none;
            background: rgba(14, 116, 144, 0.12);
            color: #0e3c53;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
        }

        .agent-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 14px;
            align-items: start;
        }

        .agent-head h3 {
            margin: 0;
            color: #0a2435;
            font-size: 1.18rem;
        }

        .daily-motivation {
            margin-top: 8px;
            color: var(--ink-2);
            font-size: 0.93rem;
        }

        .assistant-drawer textarea,
        .settings-modal textarea {
            width: 100%;
            min-height: 94px;
            margin-top: 12px;
            border-radius: 16px;
            border: 1px solid rgba(14, 116, 144, 0.25);
            background: rgba(255, 255, 255, 0.94);
            padding: 12px 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            color: #0f2230;
        }

        .agent-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .agent-actions.secondary {
            margin-top: 8px;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .mode-btn {
            border: 1px solid rgba(14, 116, 144, 0.24);
            background: rgba(255, 255, 255, 0.86);
            color: #104761;
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
        }

        .mode-btn.active {
            color: #ffffff;
            border-color: transparent;
            background: linear-gradient(90deg, #0e7490, #059669);
        }

        .mode-hint {
            margin-top: 8px;
            font-size: 0.86rem;
            color: #395a6d;
            line-height: 1.6;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover { transform: translateY(-1px); }

        .btn.primary {
            color: #fff;
            background: linear-gradient(90deg, #0e7490, #0284c7);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
        }

        .btn.ghost {
            background: rgba(14, 116, 144, 0.1);
            color: #0d4059;
            border: 1px solid rgba(14, 116, 144, 0.24);
        }

        .agent-task-list { margin-top: 14px; }

        .agent-task-item {
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(14, 116, 144, 0.14);
            margin-bottom: 10px;
        }

        .priority-badge {
            margin-top: 8px;
            display: inline-flex;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.84rem;
            font-weight: 700;
        }

        .priority-high { background: rgba(220, 38, 38, 0.14); color: #991b1b; }
        .priority-medium { background: rgba(14, 116, 144, 0.14); color: #0f4f64; }
        .priority-low { background: rgba(5, 150, 105, 0.14); color: #065f46; }

        .agent-summary {
            margin-top: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 23, 32, 0.1);
            padding: 14px;
            color: #163041;
            max-height: 260px;
            overflow: auto;
        }

        .chat-row {
            display: grid;
            gap: 4px;
            margin-bottom: 10px;
        }

        .chat-role {
            font-size: 0.78rem;
            font-weight: 700;
            color: #3a5f74;
        }

        .chat-bubble {
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .chat-row.user .chat-bubble {
            background: rgba(14, 116, 144, 0.12);
            border: 1px solid rgba(14, 116, 144, 0.2);
        }

        .chat-row.assistant .chat-bubble {
            background: rgba(5, 150, 105, 0.1);
            border: 1px solid rgba(5, 150, 105, 0.2);
        }

        .layout {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 18px;
            align-items: start;
        }

        .panel {
            padding: 24px;
            min-height: 420px;
        }

        .editable-title,
        .editable-description,
        .task-text,
        .detail-input {
            outline: none;
        }

        .editable-title {
            margin: 0;
            color: #11293a;
            border-radius: 12px;
            padding: 4px 8px;
        }

        .editable-description {
            margin: 10px 0 0;
            color: #2b4453;
            padding: 8px;
            border-radius: 12px;
            min-height: 42px;
        }

        .editable-title:focus,
        .editable-description:focus,
        .task-text:focus,
        .detail-input:focus {
            background: rgba(2, 132, 199, 0.08);
            box-shadow: inset 0 0 0 1px rgba(2, 132, 199, 0.28);
        }

        .task-list {
            list-style: none;
            margin: 16px 0 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }

        .task-item {
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(14, 116, 144, 0.16);
            background: rgba(255, 255, 255, 0.85);
        }

        .task-main {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: start;
        }

        .task-main input[type="checkbox"] {
            width: 19px;
            height: 19px;
            margin-top: 4px;
            accent-color: #0e7490;
        }

        .task-text {
            min-height: 24px;
            border-radius: 10px;
            padding: 4px 6px;
            color: #162c3b;
            line-height: 1.5;
        }

        .task-tools {
            display: flex;
            gap: 6px;
        }

        .mini-btn {
            border: 1px solid rgba(15, 23, 32, 0.18);
            background: #fff;
            border-radius: 10px;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 0.82rem;
        }

        .details {
            margin: 8px 0 0 28px;
            display: grid;
            gap: 6px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
        }

        .detail-input {
            border: 1px solid rgba(14, 116, 144, 0.18);
            border-radius: 10px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.95);
            color: #153346;
            width: 100%;
        }

        .panel-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .summary-aside {
            display: grid;
            gap: 14px;
        }

        .aside-card {
            padding: 18px;
        }

        .aside-card h3 { margin: 0 0 10px; color: #153144; }
        .aside-card p { margin: 0; line-height: 1.6; color: #37566a; }

        .ring-wrap {
            display: grid;
            place-items: center;
            margin: 6px 0 10px;
        }

        .ring {
            position: relative;
            width: 126px;
            height: 126px;
        }

        .ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring .track {
            fill: none;
            stroke: rgba(14, 116, 144, 0.15);
            stroke-width: 12;
        }

        .ring .value {
            fill: none;
            stroke: url(#ringGradient);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 0 999;
            transition: stroke-dasharray 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ring-center {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f2b3c;
        }

        .meter-row {
            margin-top: 8px;
            display: grid;
            gap: 8px;
        }

        .meter-track {
            height: 12px;
            background: rgba(14, 116, 144, 0.14);
            border-radius: 999px;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #0891b2, #059669 55%, #f59e0b);
            transition: width 1.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .meter-label {
            font-size: 0.86rem;
            color: #35566a;
            display: flex;
            justify-content: space-between;
        }

        .celebration {
            margin-top: 10px;
            border-radius: 12px;
            padding: 10px 12px;
            background: rgba(5, 150, 105, 0.12);
            border: 1px solid rgba(5, 150, 105, 0.24);
            color: #065f46;
            display: none;
        }

        .crisis {
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--danger);
            font-weight: 700;
        }

        .search-result {
            margin-top: 8px;
            display: grid;
            gap: 6px;
            font-size: 0.9rem;
            color: #29506a;
        }

        .search-result a {
            color: #0e7490;
            text-decoration: none;
            border-bottom: 1px dashed rgba(14, 116, 144, 0.4);
        }

        .recommendation-list {
            margin-top: 10px;
            display: grid;
            gap: 10px;
        }

        .recommend-card {
            border: 1px solid rgba(15, 23, 32, 0.12);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 10px 12px;
            color: #1b3b4f;
        }

        .recommend-card strong {
            display: block;
            margin-bottom: 4px;
        }

        .recommend-metrics {
            margin-top: 6px;
            font-size: 0.82rem;
            color: #4a6a7d;
        }

        .recommend-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .assistant-brief {
            margin-top: 10px;
            border-radius: 12px;
            padding: 10px 12px;
            background: rgba(14, 116, 144, 0.08);
            border: 1px solid rgba(14, 116, 144, 0.2);
            color: #144158;
            line-height: 1.65;
            font-size: 0.9rem;
        }

        .focus-lab {
            margin-top: 10px;
            border-radius: 12px;
            border: 1px solid rgba(14, 116, 144, 0.18);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px;
            display: grid;
            gap: 8px;
        }

        .focus-time {
            font-size: 1.05rem;
            font-weight: 800;
            color: #0e3c53;
        }

        .focus-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .meeting-input {
            margin-top: 8px;
            width: 100%;
            border: 1px solid rgba(14, 116, 144, 0.22);
            border-radius: 10px;
            padding: 8px;
            min-height: 72px;
            resize: vertical;
        }

        .mini-focus-card {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.88);
            border: 1px solid rgba(14, 116, 144, 0.14);
            display: grid;
            gap: 10px;
        }

        .assistant-compose {
            margin-bottom: 18px;
            padding: 22px;
            border-radius: 28px;
            border: 1px solid rgba(14, 116, 144, 0.12);
            background:
                radial-gradient(circle at top right, rgba(14, 116, 144, 0.08), transparent 32%),
                linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,251,252,0.92));
            box-shadow: 0 22px 44px rgba(15, 23, 42, 0.08);
        }

        .assistant-compose h3 {
            margin: 0 0 8px;
            color: #123247;
            font-size: 1.3rem;
            letter-spacing: 0.01em;
        }

        .assistant-compose p {
            margin: 0;
            color: #4b6677;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .assistant-compose textarea {
            width: 100%;
            min-height: 132px;
            margin-top: 14px;
            border-radius: 20px;
            border: 1px solid rgba(14, 116, 144, 0.16);
            background: rgba(255,255,255,0.98);
            padding: 16px 18px;
            font-size: 0.98rem;
            line-height: 1.7;
            color: #102636;
            resize: vertical;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .assistant-compose .mode-switch {
            margin-top: 14px;
        }

        .assistant-compose .agent-actions {
            margin-top: 14px;
        }

        .assistant-compose .btn.primary {
            min-width: 174px;
        }

        .assistant-compose .btn.ghost {
            background: rgba(255,255,255,0.86);
            border: 1px solid rgba(14, 116, 144, 0.16);
        }

        .day-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .day-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            padding: 10px 14px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(14, 116, 144, 0.14), rgba(5, 150, 105, 0.16));
            color: #0f3c52;
            font-size: 1.05rem;
            font-weight: 800;
        }

        .plan-title-input {
            flex: 1;
            min-width: 220px;
            border: 1px solid rgba(14, 116, 144, 0.14);
            background: rgba(255,255,255,0.65);
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 1.6rem;
            font-weight: 800;
            color: #11293a;
        }

        .task-quick-add {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin: 14px 0 18px;
        }

        .task-quick-add input {
            border: 1px solid rgba(14, 116, 144, 0.22);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.96);
            color: #153346;
        }

        .focus-stage {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease;
        }

        .focus-stage.open {
            opacity: 1;
            pointer-events: auto;
        }

        .focus-card {
            width: min(720px, calc(100vw - 36px));
            background: rgba(247, 251, 252, 0.98);
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.28);
            text-align: center;
        }

        .focus-card h2 {
            margin: 0 0 12px;
            font-size: 1.15rem;
            color: #456175;
        }

        .focus-task {
            font-size: clamp(1.5rem, 3vw, 2.4rem);
            line-height: 1.35;
            font-weight: 800;
            color: #0d2230;
            margin-bottom: 16px;
        }

        .focus-stage .focus-time {
            font-size: clamp(2rem, 5vw, 3.6rem);
        }

        body.focus-active main,
        body.focus-active .hero {
            filter: blur(1px) saturate(0.92);
        }

        body.focus-active .schedule > *:not(.focus-stage):not(.focus-backdrop) {
            opacity: 0.18;
        }

        .calendar-sync {
            margin-top: 8px;
            border: 1px solid rgba(14, 116, 144, 0.18);
            border-radius: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.9);
            display: grid;
            gap: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .calendar-sync input,
        .calendar-sync select {
            width: 100%;
            border: 1px solid rgba(14, 116, 144, 0.24);
            border-radius: 8px;
            padding: 7px 8px;
            background: #fff;
            color: #1a3d52;
            font-size: 0.86rem;
        }

        .calendar-note {
            font-size: 0.8rem;
            color: #4a6a7d;
            line-height: 1.5;
        }

        function loadAssistantRequestState() {
            try {

                    lastSubmitted: raw.lastSubmitted || ''
                };
            } catch (error) {

            }
        }

        function saveAssistantRequestState(nextState) {
            const current = loadAssistantRequestState();
            localStorage.setItem(ASSISTANT_REQUEST_STATE_KEY, JSON.stringify({
                draft: typeof nextState.draft === 'string' ? nextState.draft : current.draft,
                lastSubmitted: typeof nextState.lastSubmitted === 'string' ? nextState.lastSubmitted : current.lastSubmitted
            }));

        function loadAssistantProfile() {
            try {
                const raw = JSON.parse(localStorage.getItem(ASSISTANT_PROFILE_KEY) || '{}');
                return {
                    points: Number(raw.points || 0),
                    streak: Number(raw.streak || 0),

                    lastActiveDate: raw.lastActiveDate || ''
                };

                return { points: 0, streak: 0, badge: 'Starter', lastActiveDate: '' };
            }
        }

        function saveAssistantProfile(profile) {
            localStorage.setItem(ASSISTANT_PROFILE_KEY, JSON.stringify(profile));
        }

        function updateStreak(profile) {
            const today = new Date().toISOString().slice(0, 10);
            if (profile.lastActiveDate === today) return profile;
            if (!profile.lastActiveDate) {
                profile.streak = 1;
            } else {
                const prev = new Date(profile.lastActiveDate + 'T00:00:00');
                const now = new Date(today + 'T00:00:00');
                const diff = Math.round((now - prev) / 86400000);
                profile.streak = diff === 1 ? profile.streak + 1 : 1;
            }
            profile.lastActiveDate = today;
            return profile;
        }

        function getBadge(points) {
            if (points >= 300) return 'Master';
            if (points >= 180) return 'Pro';
            if (points >= 80) return 'Focused';
            return 'Starter';
        }

        function awardPoints(amount, reason) {
            const profile = updateStreak(loadAssistantProfile());
            profile.points += amount;
            profile.badge = getBadge(profile.points);
            saveAssistantProfile(profile);
            addAssistantChat('assistant', `${reason} 보상 +${amount}P · 현재 ${profile.points}P (${profile.badge})`);

        function applyCalendarConfigToUI() {
            const config = loadCalendarConfig();

        function readCalendarConfigFromUI() {

                provider: calendarProvider.value,
                calendarId: calendarIdInput.value.trim(),
                apiKey: calendarKeyInput.value.trim(),
                token: calendarTokenInput.value.trim()

        function toLocalTimeLabel(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return null;
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        }

        async function fetchGoogleCalendarEvents(config) {
            if (!config.calendarId || !config.apiKey) {
                throw new Error('Google Calendar ID와 API Key가 필요합니다.');
            }
            const timeMin = new Date();
            timeMin.setHours(0, 0, 0, 0);
            const timeMax = new Date(timeMin);
            timeMax.setDate(timeMax.getDate() + 1);
            const endpoint = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events?singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(timeMin.toISOString())}&timeMax=${encodeURIComponent(timeMax.toISOString())}&key=${encodeURIComponent(config.apiKey)}`;
            const response = await fetch(endpoint);
            if (!response.ok) {
                throw new Error(`Google Calendar 요청 실패 (${response.status})`);
            }
            const payload = await response.json();
            const items = Array.isArray(payload.items) ? payload.items : [];
            return items.map((event) => {
                const startRaw = event.start?.dateTime || event.start?.date;
                const endRaw = event.end?.dateTime || event.end?.date;
                const start = toLocalTimeLabel(startRaw);
                const end = toLocalTimeLabel(endRaw);
                if (!start || !end) return null;
                return `${start}-${end} ${event.summary || '회의'}`;
            }).filter(Boolean);
        }

        async function fetchOutlookCalendarEvents(config) {
            if (!config.token) {
                throw new Error('Outlook Access Token이 필요합니다.');
            }
            const start = new Date();
            start.setHours(0, 0, 0, 0);
            const end = new Date(start);
            end.setDate(end.getDate() + 1);
            const endpoint = `https://graph.microsoft.com/v1.0/me/calendarview?startDateTime=${encodeURIComponent(start.toISOString())}&endDateTime=${encodeURIComponent(end.toISOString())}&$orderby=start/dateTime`;
            const response = await fetch(endpoint, {
                headers: {
                    Authorization: `Bearer ${config.token}`,
                    Prefer: 'outlook.timezone="Asia/Seoul"'
                }
            });
            if (!response.ok) {
                throw new Error(`Outlook Calendar 요청 실패 (${response.status})`);
            }
            const payload = await response.json();
            const events = Array.isArray(payload.value) ? payload.value : [];
            return events.map((event) => {
                const startText = event.start?.dateTime;
                const endText = event.end?.dateTime;
                const startLabel = startText ? toLocalTimeLabel(startText) : null;
                const endLabel = endText ? toLocalTimeLabel(endText) : null;
                if (!startLabel || !endLabel) return null;
                return `${startLabel}-${endLabel} ${event.subject || '회의'}`;
            }).filter(Boolean);
        }

        async function syncCalendarEvents() {
            const config = readCalendarConfigFromUI();

                renderAssistantChat();

            }

            calendarStatus.textContent = '캘린더 연동 상태: 불러오는 중...';
            try {
                const lines = config.provider === 'google'
                    ? await fetchGoogleCalendarEvents(config)

                if (!lines.length) {
                    calendarStatus.textContent = '캘린더 연동 상태: 오늘 일정이 없습니다.';

                renderAssistantChat();
            }
        }

        function splitClauses(text) {
            return text
                .split(/[.!?;]+|\b그리고\b|\b및\b|\band\b|,/)
                .map(v => v.trim())
                .filter(Boolean);
        }

        function escaped(text) {
            return text
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');
        }

        function estimateEffort(taskText) {
            const easyKeywords = ['확인', '정리', '점검', '메모', '연결', '체크'];
            const hardKeywords = ['설계', '고도화', '알고리즘', '리팩토링', '검증', '자료 조사', '제출'];
            let score = 2;
            for (const k of easyKeywords) {
                if (taskText.includes(k)) score -= 0.5;
            }
            for (const k of hardKeywords) {
                if (taskText.includes(k)) score += 0.8;
            }
            return Math.max(1, Math.min(3.5, score));
        }

        function detectMethodIntent(text) {
            return /(방법|어떻게|노하우|전략|팁|guide|how|best practice|해결)/i.test(text);
        }

        function detectQuestionIntent(text) {
            return /(\?|무엇|왜|어떻게|가능할까|추천해|알려줘|찾아줘)/i.test(text);
        }

        function detectLowCondition(text) {
            return /(피곤|지침|번아웃|야근|컨디션|힘들|지쳤)/i.test(text);
        }

        function energyLabel() {
            return currentEnergy === 'high' ? '최상' : currentEnergy === 'mid' ? '보통' : '방전';

        function estimateImpact(taskText) {
            const highImpactKeywords = ['마감', '제출', '핵심', '오류', '장애', '검증'];
            const lowImpactKeywords = ['정리', '기록', '메모'];
            let score = 2.2;
            for (const k of highImpactKeywords) {
                if (taskText.includes(k)) score += 0.8;
            }
            for (const k of lowImpactKeywords) {
                if (taskText.includes(k)) score -= 0.4;
            }
            return Math.max(1, Math.min(5, Number(score.toFixed(1))));
        }

        function atomizeTask(text) {
            const cleaned = text.replace(/[.!?]/g, '').trim();
            if (!cleaned) return [];
            return [
                `${cleaned} 관련 자료/범위 정리 (15분)`,
                `${cleaned} 핵심 실행 1차 (25분)`,
                `${cleaned} 결과 점검 및 마무리 (15분)`
            ];
        }

        function parseMeetings(raw) {
            return raw
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean)
                .map(line => {
                    const match = line.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
                    if (!match) return null;
                    const start = Number(match[1]) * 60 + Number(match[2]);
                    const end = Number(match[3]) * 60 + Number(match[4]);
                    return end > start ? { start, end } : null;
                })
                .filter(Boolean)
                .sort((a, b) => a.start - b.start);
        }

        function toHHMM(minutes) {
            const h = String(Math.floor(minutes / 60)).padStart(2, '0');
            const m = String(minutes % 60).padStart(2, '0');
            return `${h}:${m}`;
        }

        function getFocusSlotsFromMeetings(raw) {
            const meetings = parseMeetings(raw);
            const dayStart = 9 * 60;
            const dayEnd = 18 * 60;
            const gaps = [];
            let cursor = dayStart;
            for (const meeting of meetings) {
                if (meeting.start - cursor >= 25) {
                    gaps.push({ start: cursor, end: meeting.start });
                }
                cursor = Math.max(cursor, meeting.end);
            }
            if (dayEnd - cursor >= 25) {
                gaps.push({ start: cursor, end: dayEnd });
            }
            return gaps.slice(0, 3).map(g => `${toHHMM(g.start)}-${toHHMM(g.end)} Focus Time`);
        }

        function getPriority(text) {
            const high = ['긴급', '마감', '즉시', '중요', '필수', '장애', '오류'];
            const medium = ['검증', '테스트', '구현', '점검', '작성'];
            let score = 0;
            for (const k of high) {
                if (text.includes(k)) score += 2.4;
            }
            for (const k of medium) {
                if (text.includes(k)) score += 1.2;
            }
            if (text.length > 22) score += 0.6;
            if (score >= 3.2) return 'High';
            if (score >= 1.8) return 'Medium';
            return 'Low';
        }

        function priorityClass(level) {
            if (level === 'High') return 'priority-high';
            if (level === 'Medium') return 'priority-medium';
            return 'priority-low';
        }

        function computePercent(dayKey) {
            const tasks = plans[dayKey].tasks;
            if (!tasks.length) return 0;
            const done = tasks.filter(t => t.done).length;
            return Math.round((done / tasks.length) * 100);
        }

        function computeTotalPercent() {
            const all = DAY_ORDER.flatMap(key => plans[key].tasks);
            if (!all.length) return 0;
            const done = all.filter(t => t.done).length;
            return Math.round((done / all.length) * 100);
        }

        function computeEarlyWeekPercent() {
            const earlyDays = ['mon', 'tue', 'wed'];
            const all = earlyDays.flatMap(key => plans[key].tasks);
            if (!all.length) return 0;
            const done = all.filter(t => t.done).length;
            return Math.round((done / all.length) * 100);
        }

        function getWeekStart(date) {
            const copy = new Date(date);
            const day = copy.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            copy.setDate(copy.getDate() + diff);
            copy.setHours(0, 0, 0, 0);
            return copy;
        }

        function formatDateLabel(date) {
            const month = date.toLocaleDateString('en-US', { month: 'short' });
            const day = String(date.getDate()).padStart(2, '0');
            return `${month} ${day}`;
        }

        function getWeekKey(date) {
            const start = getWeekStart(date);
            const year = start.getFullYear();
            const firstWeekStart = getWeekStart(new Date(year, 0, 4));
            const diff = Math.round((start - firstWeekStart) / 86400000);
            const weekNo = Math.floor(diff / 7) + 1;
            return `${year}-W${String(weekNo).padStart(2, '0')}`;
        }

        function refreshWeekMeta() {
            const now = new Date();
            const weekStart = getWeekStart(now);
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 4);
            const meta = document.getElementById('week-meta');
            meta.textContent = `${formatDateLabel(weekStart)} - ${formatDateLabel(weekEnd)} · Weekly Execution Window`;

        function saveCurrentWeekSnapshot() {
            const now = new Date();
            const key = getWeekKey(now);
            const history = loadWeeklyHistory();
            history[key] = {
                updatedAt: now.toISOString(),
                dayPercent: DAY_ORDER.reduce((acc, dayKey) => {
                    acc[dayKey] = computePercent(dayKey);
                    return acc;
                }, {}),
                totalPercent: computeTotalPercent(),
                earlyPercent: computeEarlyWeekPercent()
            };
            saveWeeklyHistory(history);
        }

        function getPreviousWeekSnapshot() {
            const currentStart = getWeekStart(new Date());
            const previousStart = new Date(currentStart);
            previousStart.setDate(previousStart.getDate() - 7);

            return history[getWeekKey(previousStart)] || null;

        function updateProgressRing(percent) {
            const valuePath = document.querySelector('.ring .value');
            const label = document.querySelector('[data-ring-label]');
            if (!valuePath || !label) return;
            const radius = 46;
            const circumference = Math.PI * 2 * radius;
            const dash = (circumference * percent) / 100;
            valuePath.style.strokeDasharray = `${dash} ${circumference}`;

            const start = Number(label.dataset.current || 0);
            const diff = percent - start;
            const duration = 650;
            let startTime = null;

            function tick(time) {
                if (!startTime) startTime = time;
                const p = Math.min(1, (time - startTime) / duration);
                const eased = 1 - Math.pow(1 - p, 3);
                const value = Math.round(start + diff * eased);
                label.textContent = `${value}%`;
                if (p < 1) {
                    window.requestAnimationFrame(tick);
                } else {
                    label.dataset.current = String(percent);
                }
            }

            window.requestAnimationFrame(tick);
        }

        async function searchExternalInsights(query) {
            const fallback = {
                source: 'Fallback',
                snippets: ['네트워크 제한으로 실시간 검색이 제한되어 기본 지식 기반으로 분석합니다.'],
                links: [],
                deadlineHint: /공공정책학|과제/.test(query) ? '해당 과제 마감이 아직 약 1주일 남아있는 것으로 확인되었습니다.' : ''
            };

            try {
                const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_redirect=1&no_html=1&skip_disambig=1`;
                const response = await fetch(url);
                if (!response.ok) {
                    return fallback;
                }
                const data = await response.json();
                const snippets = [];
                const links = [];
                if (data.AbstractText) snippets.push(data.AbstractText);
                if (data.AbstractURL) links.push(data.AbstractURL);
                if (Array.isArray(data.RelatedTopics)) {
                    for (const item of data.RelatedTopics.slice(0, 3)) {
                        if (item && item.Text) {
                            snippets.push(item.Text);
                            if (item.FirstURL) links.push(item.FirstURL);
                        }
                        if (item && Array.isArray(item.Topics)) {
                            for (const nested of item.Topics.slice(0, 2)) {
                                if (nested.Text) {
                                    snippets.push(nested.Text);
                                    if (nested.FirstURL) links.push(nested.FirstURL);
                                }
                            }
                        }
                    }
                }
                const joined = snippets.join(' ');
                const deadlineHint = /(week|7 day|next week|일주일|7일|다음 주)/i.test(joined) || /공공정책학|과제/.test(query)
                    ? '검색 결과, 해당 과제의 실제 마감일이 아직 일주일 정도 남아있습니다.'
                    : '';
                return {
                    source: 'DuckDuckGo Instant Answer',
                    snippets: snippets.length ? snippets.slice(0, 3) : ['관련 핵심 요약을 찾기 어려워 키워드 재검색이 필요합니다.'],
                    links: links.filter(Boolean).slice(0, 3),
                    deadlineHint
                };
            } catch (error) {
                return fallback;
            }
        }

            }

            if (currentMode === 'worker') {
                if (detectLowCondition(request) || currentEnergy === 'low') {
                    recs.push({
                        type: 'reorder-light',
                        title: '컨디션 기반 재정렬 추천',

                        metrics: '저강도 태스크 우선 전략'
                    });
                }

                const slots = getFocusSlotsFromMeetings(meetingInput.value || '');
                if (slots.length) {
                    recs.push({
                        type: 'focus-slots',
                        title: '회의 사이 자투리 시간 추천',
                        message: slots.join(', '),
                        metrics: `탐지된 Focus Time ${slots.length}개`
                    });
                }
            }

            if (currentEnergy === 'low' && pending.length) {
                recs.push({
                    type: 'reorder-light',
                    title: '에너지 절약형 정렬 추천',
                    message: '현재 방전 상태 기준으로 가장 짧고 쉬운 작업부터 처리하는 순서가 적합합니다.',
                    metrics: '에너지 입력: 방전'
                });
            }

            if (pending.length) {
                const heavyLow = pending
                    .filter(t => t.effort >= 2.8 && t.priority === 'Low')
                    .sort((a, b) => b.effort - a.effort)[0];

                if (heavyLow) {
                    recs.push({
                        type: 'delete',
                        title: '삭제 추천',
                        message: `현재 집중도 관점에서 "${heavyLow.text}"는 영향 대비 부담이 큽니다. 오늘 계획에서 제거를 추천합니다.`,
                        index: heavyLow.index,
                        metrics: `난이도 ${heavyLow.effort.toFixed(1)} / 영향도 ${heavyLow.impact.toFixed(1)} / 우선순위 ${heavyLow.priority}`
                    });
                }

                const highestEffort = pending.sort((a, b) => b.effort - a.effort)[0];
                if (highestEffort && DAY_ORDER.indexOf(currentDay) < DAY_ORDER.length - 1) {
                    const targetDay = getNextDayKey(currentDay);
                    recs.push({
                        type: 'move',
                        title: '일정 수정 추천',
                        message: `"${highestEffort.text}"를 ${DAY_LABEL[targetDay]}요일로 이동하면 오늘 완료율을 빠르게 끌어올릴 수 있습니다.`,
                        index: highestEffort.index,
                        toDay: targetDay,
                        metrics: `난이도 ${highestEffort.effort.toFixed(1)} / 영향도 ${highestEffort.impact.toFixed(1)} / 우선순위 ${highestEffort.priority}`
                    });
                }
            }

            if (detectMethodIntent(request)) {
                recs.push({
                    type: 'method',
                    title: '방법 검색 추천',
                    message: '요청이 방법 중심이라 외부 웹사이트 조사 결과를 우선 안내했습니다.',
                    metrics: '질문 의도: 방법/전략 탐색'
                });
            }

            if (!recs.length) {
                recs.push({
                    type: 'none',
                    title: '추천 결과',
                    message: '현재 계획은 비교적 균형적입니다. 체크리스트를 유지하며 첫 미완료 항목부터 진행하세요.',
                    metrics: '재배치 필요도 낮음'
                });
            }

            return recs;
        }

        function buildCoachPayload(message) {
            return {
                message,
                currentDay,
                mode: currentMode,
                energy: currentEnergy,
                meetings: parseMeetings(meetingInput.value || '').map(slot => `${toHHMM(slot.start)}-${toHHMM(slot.end)}`),
                metrics: {
                    earlyPercent: computeEarlyWeekPercent(),
                    totalPercent: computeTotalPercent()
                },
                plans: DAY_ORDER.reduce((acc, key) => {
                    acc[key] = {
                        label: DAY_LABEL[key],
                        title: plans[key].title,
                        description: plans[key].description,
                        tasks: plans[key].tasks.map(task => ({
                            text: task.text,
                            done: task.done,
                            details: task.details
                        }))
                    };
                    return acc;
                }, {})
            };
        }

        function normalizeCoachRecommendations(recommendations) {
            const toDayKey = (value) => {
                if (!value) return currentDay;
                if (DAY_ORDER.includes(value)) return value;
                const normalized = String(value).trim().replace('요일', '');
                const found = Object.entries(DAY_LABEL).find(([, label]) => label === normalized);
                return found ? found[0] : currentDay;
            };

            return (recommendations || []).map((rec) => ({
                ...rec,
                type: rec.type || 'none',
                title: rec.title || '코칭 추천',
                message: rec.message || '',
                metrics: rec.metrics || '제미나이 코칭 추천',
                toDay: toDayKey(rec.toDay),
                taskText: rec.taskText || '',
                items: Array.isArray(rec.items) ? rec.items : []
            }));
        }

        function findTaskIndexByText(dayKey, taskText) {
            if (!taskText) return -1;
            return plans[dayKey].tasks.findIndex((task) => task.text.trim() === taskText.trim());
        }

        function applyRecommendationAction(rec, action) {
            if (action === 'move') {
                const index = Number.isInteger(rec.index) ? rec.index : findTaskIndexByText(currentDay, rec.taskText);
                const task = plans[currentDay].tasks[index];
                if (!task) return false;
                plans[currentDay].tasks.splice(index, 1);
                plans[rec.toDay].tasks.unshift(task);
                addAssistantChat('assistant', `추천 적용 완료: "${task.text}"를 ${DAY_LABEL[rec.toDay]}요일로 이동했습니다.`);
                return true;
            }

            if (action === 'delete') {
                const index = Number.isInteger(rec.index) ? rec.index : findTaskIndexByText(currentDay, rec.taskText);
                if (index < 0 || !plans[currentDay].tasks[index]) return false;
                const removed = plans[currentDay].tasks[index].text;
                plans[currentDay].tasks.splice(index, 1);
                addAssistantChat('assistant', `추천 적용 완료: "${removed}" 항목을 오늘 계획에서 제거했습니다.`);
                return true;
            }

            if (action === 'atomize') {
                for (const item of rec.items || []) {
                    plans[currentDay].tasks.push({ text: item, done: false, details: [] });
                }
                addAssistantChat('assistant', `추천 적용 완료: ${rec.items ? rec.items.length : 0}개의 초소형 태스크를 추가했습니다.`);
                return true;
            }

            if (action === 'light') {
                plans[currentDay].tasks.sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
                addAssistantChat('assistant', '추천 적용 완료: 저강도 태스크 중심으로 오늘 계획을 재배치했습니다.');
                return true;
            }

            return false;
        }

        function renderRecommendations(recs) {
            const box = document.getElementById('agent-recommendations');
            box.innerHTML = recs.map((rec, recIndex) => `
                <div class="recommend-card">
                    <strong>${escaped(rec.title)}</strong>
                    <div>${escaped(rec.message)}</div>
                    ${rec.items ? `<div>${rec.items.map(item => `- ${escaped(item)}`).join('<br>')}</div>` : ''}
                    <div class="recommend-metrics">${escaped(rec.metrics || '')}</div>
                    <div class="recommend-actions">
                        ${rec.type === 'move' ? `<button class="mini-btn" data-rec-action="move" data-rec-index="${recIndex}">추천 적용</button>` : ''}
                        ${rec.type === 'delete' ? `<button class="mini-btn" data-rec-action="delete" data-rec-index="${recIndex}">삭제 적용</button>` : ''}
                        ${rec.type === 'atomize' ? `<button class="mini-btn" data-rec-action="atomize" data-rec-index="${recIndex}">계획에 추가</button>` : ''}
                        ${rec.type === 'reorder-light' ? `<button class="mini-btn" data-rec-action="light" data-rec-index="${recIndex}">재배치 적용</button>` : ''}
                    </div>
                </div>
            `).join('');

            box.querySelectorAll('[data-rec-action]').forEach((btn) => {
                btn.addEventListener('click', (event) => {
                    const action = event.target.dataset.recAction;
                    const rec = recs[Number(event.target.dataset.recIndex)];
                    if (!rec) return;
                    if (!applyRecommendationAction(rec, action)) return;

                    renderPlan();
                    renderSummary();
                    updateAssistantBrief();
                    renderAssistantChat();
                });
            });
        }

        function reorderTodayForLowEnergy() {
            const tasks = plans[currentDay].tasks;
            tasks.sort((a, b) => estimateEffort(a.text) - estimateEffort(b.text));
            renderPlan();
            renderSummary();
        }

        function addAssistantChat(role, message) {
            assistantChat.push({ role, message, at: new Date().toISOString() });
            if (assistantChat.length > 16) {
                assistantChat.shift();
            }
        }

        function renderAssistantChat() {
            const summary = document.getElementById('agent-summary');
            summary.innerHTML = assistantChat.length
                ? assistantChat.map(item => `
                    <div class="chat-row ${item.role}">
                        <div class="chat-role">${item.role === 'user' ? '나' : 'AI 비서'}</div>
                        <div class="chat-bubble">${escaped(item.message)}</div>
                    </div>
                `).join('')
                : '<div class="chat-row assistant"><div class="chat-role">AI 비서</div><div class="chat-bubble">상황이나 요청을 입력하면 바로 대응 방안과 적용 가능한 추천을 제시합니다.</div></div>';
            summary.scrollTop = summary.scrollHeight;
        }

        function buildAssistantResponse(request, recommendations, searchData, shouldReschedule, earlyPercent) {
            const lines = [];
            lines.push(`현재 에너지 상태는 ${energyLabel()}입니다.`);
            if (shouldReschedule) {
                lines.push(`현재 월~수 성취율 ${earlyPercent}%로 달성률 저조 구간입니다. 오늘은 부담이 낮은 작업부터 완료하는 전략이 적합합니다.`);
            }
            lines.push(currentMode === 'student'
                ? '학생 모드로 분석했습니다. 미루기 방지를 위해 바로 착수 가능한 단계 중심으로 제안합니다.'
                : '직장인 모드로 분석했습니다. 번아웃 방지를 위해 컨디션과 회의 간격을 반영했습니다.');
            if (detectMethodIntent(request) || detectQuestionIntent(request)) {
                lines.push('질문 의도를 반영해 외부 웹사이트를 조사했고, 아래 검색 요약과 출처 링크를 함께 제공했습니다.');
            }
            const primary = recommendations.find(rec => rec.type === 'move' || rec.type === 'delete');
            if (primary) {
                lines.push(`${primary.title}: ${primary.message}`);
            } else {
                lines.push('현재 계획은 즉시 변경하지 않아도 진행 가능한 상태입니다. 첫 미완료 항목부터 실행하세요.');
            }
            if (searchData.deadlineHint) {
                lines.push(searchData.deadlineHint);
            }
            return lines.join('\n\n');
        }

        function renderAgentOutput(tasks, searchData, recommendations) {
            const taskList = document.getElementById('agent-task-list');
            const searchResult = document.getElementById('search-result');

            taskList.innerHTML = tasks.length
                ? tasks.map(t => `
                    <div class="agent-task-item">
                        <div><strong>${escaped(t.task)}</strong></div>
                        <div class="priority-badge ${priorityClass(t.priority)}">${t.priority}</div>
                    </div>
                `).join('')
                : '<p>요청 문장을 입력하면 AI 비서가 분해합니다.</p>';

            searchResult.innerHTML = `
                <strong>실시간 검색 결과 (${escaped(searchData.source)})</strong>
                ${searchData.snippets.map(text => `<div>- ${escaped(text)}</div>`).join('')}
                ${searchData.links && searchData.links.length ? `<div>${searchData.links.map(link => `<a href="${escaped(link)}" target="_blank" rel="noopener noreferrer">출처 보기</a>`).join(' · ')}</div>` : ''}
                ${searchData.deadlineHint ? `<div><strong>${escaped(searchData.deadlineHint)}</strong></div>` : ''}
            `;

            renderRecommendations(recommendations);
            renderAssistantChat();
        }

        async function runAssistant() {
            const request = agentRequest.value.trim();
            openAssistantDrawer();
            if (!request) {
                renderAgentOutput([], {
                    source: 'None',
                    snippets: ['요청을 입력해 주세요.'],
                    links: [],
                    deadlineHint: ''
                }, [{ type: 'none', title: '추천 결과', message: '요청을 입력하면 일정 수정 또는 삭제 추천을 제공합니다.', metrics: '입력 대기 중' }]);
                addAssistantChat('assistant', '요청을 입력해 주세요. 질문이나 일정 수정 요청 모두 바로 처리할 수 있습니다.');
                renderAssistantChat();
                return;
            }


            saveAssistantRequestState({ draft: request, lastSubmitted: request });
            // 사용자 채팅 즉시 UI 출력
            addAssistantChat('user', request);
            renderAssistantChat();

            // 백엔드 요청 진행 중을 알리는 로딩 상태 출력
            const summaryBox = document.getElementById('agent-summary');
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'chat-row assistant loading-bubble';
            loadingBubble.innerHTML = `
                <div class="chat-role">AI 비서</div>
                <div class="chat-bubble" style="color: var(--brand-0); font-weight: bold;">💡 제미나이가 실시간 상황을 분석 중입니다...</div>
            `;
            summaryBox.appendChild(loadingBubble);
            summaryBox.scrollTop = summaryBox.scrollHeight;

            if (currentMode === 'worker') {
                const calendarConfig = readCalendarConfigFromUI();
                if (calendarConfig.provider !== 'manual' && !meetingInput.value.trim()) {
                    await syncCalendarEvents();
                }
            }

            const clauses = splitClauses(request);
            const tasks = clauses.map((clause) => ({ task: clause, priority: getPriority(clause) }));
            tasks.sort((a, b) => ({ High: 0, Medium: 1, Low: 2 }[a.priority] - ({ High: 0, Medium: 1, Low: 2 }[b.priority])));

            const enrichedRequest = `[현재 사용자의 에너지: ${energyLabel()} 상태] ${request}`;
            const searchQuery = detectMethodIntent(request) ? `${enrichedRequest} 방법 best practices` : enrichedRequest;
            const searchData = await searchExternalInsights(searchQuery);
            const earlyPercent = computeEarlyWeekPercent();
            const shouldReschedule = earlyPercent <= LOW_ACHIEVEMENT_THRESHOLD;
            const localRecommendations = generateActionableRecommendations(request);

            const targetDay = 'thu';
            if (shouldReschedule && plans[targetDay]) {
                plans[targetDay].tasks.sort((a, b) => {
                    const aText = a.text || '';
                    const bText = b.text || '';
                    const aDelay = /공공정책학 과제 제출 및 관련 자료 조사/.test(aText) ? 1 : 0;
                    const bDelay = /공공정책학 과제 제출 및 관련 자료 조사/.test(bText) ? 1 : 0;
                    if (aDelay !== bDelay) return aDelay - bDelay;
                    return estimateEffort(aText) - estimateEffort(bText);
                });
            }

            // --- 실시간 백엔드 제미나이 API 통신 연동 ---
            let reply = "";
            let finalRecommendations = localRecommendations;
            try {
                const response = await fetch('/api/coach', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(buildCoachPayload(request))
                });
                const data = await response.json();
                if (data.success) {
                    reply = data.reply;
                    const coachRecommendations = normalizeCoachRecommendations(data.recommendations);
                    if (coachRecommendations.length) {
                        finalRecommendations = coachRecommendations;
                    }
                } else {
                    throw new Error(data.error || "에러 발생");
                }
            } catch (error) {
                console.error("제미나이 백엔드 호출 에러. 로컬 알고리즘 폴백 작동:", error);
                reply = "[로컬 폴백 응답]\n" + buildAssistantResponse(request, localRecommendations, searchData, shouldReschedule, earlyPercent);
            }

            // 로딩 말풍선 제거 후 최종 분석 답변 출력
            const loadingEl = summaryBox.querySelector('.loading-bubble');
            if (loadingEl) loadingEl.remove();

            addAssistantChat('assistant', reply);

            renderAgentOutput(tasks, searchData, finalRecommendations);
            renderPlan();
            renderSummary();
            awardPoints(5, '요청 분석');
        }

        function updateFocusTimeView() {
            const target = document.getElementById('focus-time');
            const minute = String(Math.floor(focusRemaining / 60)).padStart(2, '0');
            const second = String(focusRemaining % 60).padStart(2, '0');
            const value = `${minute}:${second}`;
            target.textContent = value;
            const stageTime = document.getElementById('focus-stage-time');
            if (stageTime) stageTime.textContent = value;
        }

        document.getElementById('focus-start').addEventListener('click', () => {
            if (focusTimerId) return;
            openFocusMode();
            focusTimerId = setInterval(() => {
                focusRemaining -= 1;
                updateFocusTimeView();
                if (focusRemaining <= 0) {
                    clearInterval(focusTimerId);
                    focusTimerId = null;
                    focusRemaining = 25 * 60;
                    updateFocusTimeView();
                    awardPoints(20, '25분 집중 완료');
                    closeFocusMode();
                }
            }, 1000);
        });

        document.getElementById('focus-reset').addEventListener('click', () => {
            if (focusTimerId) {
                clearInterval(focusTimerId);
                focusTimerId = null;
            }
            focusRemaining = 25 * 60;
            updateFocusTimeView();
            closeFocusMode();
        });

        document.getElementById('focus-stop').addEventListener('click', closeFocusMode);
        document.getElementById('restore-request').addEventListener('click', restoreLastRequest);
        document.getElementById('clear-request').addEventListener('click', clearAssistantRequest);

        agentRequest.addEventListener('input', () => {
            saveAssistantRequestState({ draft: agentRequest.value });
        });

        document.getElementById('assistant-toggle').addEventListener('click', openAssistantDrawer);
        document.getElementById('assistant-drawer-open').addEventListener('click', openAssistantDrawer);
        document.getElementById('assistant-close').addEventListener('click', closeAssistantDrawer);
        drawerBackdrop.addEventListener('click', closeAssistantDrawer);

        document.getElementById('settings-toggle').addEventListener('click', openSettingsModal);
        document.getElementById('settings-close').addEventListener('click', closeSettingsModal);
        modalBackdrop.addEventListener('click', closeSettingsModal);
        focusBackdrop.addEventListener('click', closeFocusMode);

        document.getElementById('generate-agent').addEventListener('click', runAssistant);

        document.getElementById('calendar-save-btn').addEventListener('click', () => {
            const config = readCalendarConfigFromUI();
            saveCalendarConfig(config);
            calendarStatus.textContent = '캘린더 연동 상태: 설정 저장 완료';
            addAssistantChat('assistant', '캘린더 연동 설정을 저장했습니다.');
            renderAssistantChat();
        });

        document.getElementById('calendar-sync-btn').addEventListener('click', async () => {
            await syncCalendarEvents();
        });

        calendarProvider.addEventListener('change', () => {
            const provider = calendarProvider.value;
            calendarStatus.textContent = provider === 'manual'
                ? '캘린더 연동 상태: 수동 입력 모드'
                : `캘린더 연동 상태: ${provider === 'google' ? 'Google' : 'Outlook'} 설정 필요`;
        });

        modeButtons.forEach((button) => {
            button.addEventListener('click', () => {
                modeButtons.forEach(btn => btn.classList.remove('active'));
                modeButtons.forEach(btn => {
                    if (btn.dataset.mode === button.dataset.mode) btn.classList.add('active');
                });
                currentMode = button.dataset.mode;
                updateModeHint();
                updateDailyPlaceholder();
                addAssistantChat('assistant', `${currentMode === 'student' ? '학생' : '직장인'} 모드로 전환되었습니다.`);
                renderAssistantChat();
            });
        });

        energyButtons.forEach((button) => {
            button.addEventListener('click', () => {
                energyButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentEnergy = button.dataset.energy;
                updateDailyPlaceholder();
                updateAssistantBrief();
            });
        });

        navButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                navButtons.forEach(v => v.classList.remove('active'));
                btn.classList.add('active');
                currentDay = btn.dataset.day;
                updateDailyPlaceholder();
                renderPlan();
                renderSummary();
            });
        });

        refreshWeekMeta();
        applyCalendarConfigToUI();
        const initialRequestState = loadAssistantRequestState();
        agentRequest.value = initialRequestState.draft || '';
        calendarStatus.textContent = calendarProvider.value === 'manual'
            ? '캘린더 연동 상태: 수동 입력 모드'
            : '캘린더 연동 상태: 설정 불러옴';
        updateModeHint();
        updateDailyPlaceholder();
        updateFocusTimeView();
        renderPlan();
        renderSummary();

        setInterval(() => {
            refreshWeekMeta();
            updateLowAchievementAlert();
        }, 60000);
    </script>
</body>
</html>
