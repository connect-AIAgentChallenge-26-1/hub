name: "Keep Render server awake"

# Render 무료 티어는 15분 비활성 시 슬립되고, 다음 요청이 깨우는 데 20~30초 걸린다.
# 10분마다 헬스체크를 호출해서 비활성 시간이 15분을 넘지 않게 만들어 슬립 자체를 막는다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: "Ping /api/health"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Render 서버 깨우기"
        run: curl -sf "https://hub-odx8.onrender.com/api/health" || echo "핑 실패 (일시적일 수 있음, 다음 실행에서 재시도)"
