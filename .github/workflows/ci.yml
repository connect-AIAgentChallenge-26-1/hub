name: CI

on:
  pull_request: {}

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
        env:
          # 이슈 #137: 실제 Supabase 프로젝트에 연결하지 않는다 — server/crawler의
          # supabase.ts는 모듈 로드 시점에 이 값들이 없으면 throw하므로, 초기화 에러만
          # 피하기 위한 더미 값이다. 라우트/repo 테스트는 vi.mock으로 supabase 클라이언트
          # 자체를 대체해 실제 네트워크 호출이 발생하지 않는다.
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      - name: Run lint
        run: npm run lint
