name: "PR merge on time v3.4 by crong"

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: "Auto Merge on time"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Merge pull request"
        uses: "actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b" # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const listQuery = `query($owner: String!, $name: String!, $cursor: String) {
              repository(owner: $owner, name: $name) {
                defaultBranchRef { name }
                pullRequests(
                  first: 100
                  after: $cursor
                  states: OPEN
                  orderBy: { field: CREATED_AT, direction: ASC }
                ) {
                  nodes { number }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }`;

            const detailQuery = `query(
              $owner: String!
              $name: String!
              $number: Int!
              $threadCursor: String
            ) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  number
                  state
                  baseRefName
                  headRefOid
                  isDraft
                  mergeable
                  mergeStateStatus
                  reviewDecision
                  commits(last: 1) {
                    nodes {
                      commit {
                        statusCheckRollup { state }
                      }
                    }
                  }
                  reviewThreads(first: 100, after: $threadCursor) {
                    nodes { isResolved }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }`;

            async function listOpenPullRequestNumbers() {
              const numbers = [];
              let cursor = null;
              let defaultBranch;

              do {
                const data = await github.graphql(listQuery, {
                  owner: repo.owner,
                  name: repo.repo,
                  cursor,
                });
                const repository = data.repository;
                defaultBranch ??= repository.defaultBranchRef?.name;
                numbers.push(...repository.pullRequests.nodes.map(({ number }) => number));
                cursor = repository.pullRequests.pageInfo.hasNextPage
                  ? repository.pullRequests.pageInfo.endCursor
                  : null;
              } while (cursor);

              if (!defaultBranch) {
                throw new Error("Repository has no default branch");
              }

              return { defaultBranch, numbers };
            }

            async function getPullRequest(number) {
              let threadCursor = null;
              let pullRequest;
              let hasUnresolvedThread = false;

              do {
                const data = await github.graphql(detailQuery, {
                  owner: repo.owner,
                  name: repo.repo,
                  number,
                  threadCursor,
                });
                pullRequest = data.repository.pullRequest;
                if (!pullRequest) return null;

                hasUnresolvedThread ||= pullRequest.reviewThreads.nodes.some(
                  ({ isResolved }) => !isResolved,
                );
                threadCursor = pullRequest.reviewThreads.pageInfo.hasNextPage
                  ? pullRequest.reviewThreads.pageInfo.endCursor
                  : null;
              } while (threadCursor);

              return { ...pullRequest, hasUnresolvedThread };
            }

            async function hasReviewLabel(number) {
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                ...repo,
                issue_number: number,
                per_page: 100,
              });
              return labels.some(({ name }) => name.toLowerCase() === "review");
            }

            function skipReason(pr, defaultBranch, reviewLabel) {
              const checkState = pr.commits.nodes[0]?.commit.statusCheckRollup?.state;

              if (pr.state !== "OPEN") return "no longer open";
              if (pr.baseRefName === defaultBranch) return `targets default branch ${defaultBranch}`;
              if (pr.isDraft) return "draft";
              if (reviewLabel) return "review label present";
              if (pr.reviewDecision === "CHANGES_REQUESTED") return "changes requested";
              if (pr.hasUnresolvedThread) return "unresolved review conversation";
              if (pr.mergeable !== "MERGEABLE") return `mergeable=${pr.mergeable}`;
              // CLEAN is GitHub's server-side verdict that required branch gates passed.
              if (pr.mergeStateStatus !== "CLEAN") {
                return `mergeStateStatus=${pr.mergeStateStatus}`;
              }
              if (checkState && checkState !== "SUCCESS") return `checks=${checkState}`;
              return null;
            }

            const { defaultBranch, numbers } = await listOpenPullRequestNumbers();
            console.log(`Default branch: ${defaultBranch}; open PRs: ${numbers.length}`);

            for (const number of numbers) {
              try {
                const pr = await getPullRequest(number);
                if (!pr) {
                  console.log(`PR #${number} skipped: no longer available`);
                  continue;
                }

                const reviewLabel = await hasReviewLabel(number);
                const reason = skipReason(pr, defaultBranch, reviewLabel);
                if (reason) {
                  console.log(`PR #${number} skipped: ${reason}`);
                  continue;
                }

                const result = await github.rest.pulls.merge({
                  ...repo,
                  pull_number: number,
                  merge_method: "merge",
                  sha: pr.headRefOid,
                });

                if (!result.data.merged) {
                  core.warning(`PR #${number} was not merged: ${result.data.message}`);
                  continue;
                }
                console.log(`PR #${number} merged at ${result.data.sha}`);
              } catch (error) {
                core.warning(`PR #${number} merge evaluation failed: ${error.message}`);
              }
            }
