name: "PR merge on time v3.3 by crong"

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    name: "Auto Merge on time"
    runs-on: "ubuntu-latest"

    steps:
      # 판정 로직은 scripts/auto-merge-rules.js(단위 테스트 대상)에 있고,
      # 이 스텝은 GraphQL 조회·label·코멘트·병합 API 호출만 담당한다 (H6).
      - uses: actions/checkout@v4

      - name: "Merge pull request"
        uses: "actions/github-script@v7"
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const { pathToFileURL } = require('node:url');
            const rulesPath = `${process.env.GITHUB_WORKSPACE}/scripts/auto-merge-rules.js`;
            const { decide, hasStateLabel } = await import(pathToFileURL(rulesPath).href);

            const query = `query($owner:String!, $name:String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(last: 100, states: OPEN) {
                  edges {
                    node {
                      number
                      headRefName
                      baseRefName
                      author { login }
                      mergeable
                      reviewDecision
                      labels(first: 100) { nodes { name } }
                      commits(last: 1) {
                        nodes {
                          commit {
                            statusCheckRollup { state }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }`;

            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            // addLabels는 저장소에 이미 존재하는 label만 붙일 수 있다(없으면 404).
            // 4개 상태 label을 멱등하게 미리 보장해 둔다(이미 있으면 422 무시).
            const STATE_LABELS = [
              ['auto-merge:changes-requested', 'ededed'],
              ['auto-merge:conflicting', 'ededed'],
              ['auto-merge:not-approved', 'ededed'],
              ['auto-merge:ci-failing', 'ededed'],
            ];
            for (const [name, color] of STATE_LABELS) {
              await github.rest.issues.createLabel({ ...repo, name, color }).catch((e) => {
                if (e.status !== 422) console.log(`label "${name}" 생성 실패:`, e);
              });
            }

            const { repository: { pullRequests: { edges: list } } } = await github.graphql(query, {
              owner: repo.owner,
              name: repo.repo,
            });

            for (const { node: pr } of list) {
              const decision = decide(pr);
              console.log(`\n---- PR #${pr.number} → ${decision.name}`);

              if (decision.action === 'merge') {
                try {
                  await github.rest.pulls.merge({ ...repo, pull_number: pr.number, merge_method: "merge" });
                  console.log(`PR #${pr.number} 병합 완료`);
                } catch (e) {
                  console.log(`PR #${pr.number} 병합 실패:`, e);
                }
              } else if (decision.action === 'comment') {
                // "1회만"은 label로 보장한다 — 댓글은 pagination 창이 있어
                // PR이 오래 열려 있으면 marker가 창 밖으로 밀릴 수 있지만,
                // label은 PR당 유일해 생애 전체에서 정확히 추적된다.
                // 상태 전환 시 이전 label을 지우지 않는다 — 지우면 A→B→A로
                // 같은 상태에 돌아왔을 때 다시 코멘트가 달려 "생애 전체 1회"가
                // 깨진다(2026-07-12 23:51 리뷰). label은 누적만 한다.
                if (hasStateLabel(pr, decision.stateLabel)) {
                  console.log(`PR #${pr.number} 동일 상태(${decision.stateLabel}) 이미 처리됨 — 생략`);
                  continue;
                }
                try {
                  await github.rest.issues.addLabels({ ...repo, issue_number: pr.number, labels: [decision.stateLabel] });
                  await github.rest.issues.createComment({ ...repo, issue_number: pr.number, body: decision.body });
                  console.log(`PR #${pr.number} 연기 코멘트 추가 (${decision.stateLabel})`);
                } catch (e) {
                  console.log(`PR #${pr.number} 코멘트 실패:`, e);
                }
              }
            }
