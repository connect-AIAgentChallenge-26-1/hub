name: 버그
description: 재현 가능한 결함과 사용자 영향을 보고합니다.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: symptom
    attributes:
      label: 증상과 영향
      description: 기대 결과, 실제 결과와 사용자·시스템 영향을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법과 환경
      description: 명령, 입력, profile, 버전과 최소 재현 단계를 적어주세요. 비밀값은 제거하세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 로그와 관찰 증거
      description: 민감정보를 제거한 로그·스크린샷·지표 위치를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 위험과 회귀 기준
      description: 영향 범위와 수정 후 반드시 검증할 시나리오를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 관련 Issue·문서
      description: 관련 Issue, PR, WI 또는 TS가 이미 있으면 링크합니다. 새 문서를 먼저 만들 필요는 없습니다.
      placeholder: "#123, PR URL, WI-0001"
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 안전 확인
      options:
        - label: 로그와 첨부 파일에서 비밀값·개인정보를 제거했습니다.
          required: true
