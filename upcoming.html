<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>출시 예정 스낵 연구</title>
    <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <style>
        body { background-color: #FFFDEB; font-family: 'Poor Story', cursive; color: #5D4037; padding: 40px; }
        .container { max-width: 800px; margin: auto; }
        
        /* 헤더 디자인 (요리사 리락쿠마) */
        .main-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .main-header h1 { font-size: 2.5rem; color: #5D4037; margin: 0; }
        .header-img { width: 90px; height: 90px; border-radius: 50%; border: 4px solid #FFD700; object-fit: cover; box-shadow: 0 4px 0 #FFE082; }
        
        /* 스낵 리스트 카드 */
        .card { background: white; padding: 25px; border-radius: 30px; border: 4px solid #FFD700; box-shadow: 0 8px 0 #FFE082; margin-bottom: 25px; }
        
        .snack-item { display: flex; align-items: center; gap: 20px; padding: 15px 0; border-bottom: 2px dashed #FFE082; }
        .snack-item:last-child { border-bottom: none; padding-bottom: 0; }
        .snack-img { width: 120px; height: 120px; border-radius: 20px; object-fit: cover; border: 2px solid #eee; }
        
        .snack-info h3 { margin: 0 0 10px 0; font-size: 1.5rem; }
        .snack-info p { margin: 0; color: #795548; font-size: 1.1rem; }
        .d-day { background: #FF5722; color: white; padding: 4px 12px; border-radius: 15px; font-size: 0.9rem; margin-left: 10px; vertical-align: middle; }

        /* 하단 데코레이션 카드 (연구소 일상) */
        .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .deco-card { background: #FFFBF2; padding: 20px; border-radius: 30px; border: 3px solid #FFE082; text-align: center; }
        .deco-card img { width: 100px; height: 100px; border-radius: 20px; object-fit: cover; margin-bottom: 10px; border: 2px solid #FFD700; }
        
        /* 뒤로가기 버튼 */
        .back-btn { display: block; width: 150px; margin: 40px auto 0; text-align: center; background: #FFD700; color: #5D4037; padding: 15px; border-radius: 30px; text-decoration: none; font-size: 1.2rem; font-weight: bold; box-shadow: 0 5px 0 #FBC02D; transition: all 0.2s; }
        .back-btn:hover { transform: translateY(3px); box-shadow: 0 2px 0 #FBC02D; }
    </style>
</head>
<body>
<div class="container">
    <!-- 헤더: h8 (요리사 리락쿠마) -->
    <div class="main-header">
        <img src="h8.jpg" class="header-img" alt="요리사 리락쿠마">
        <h1>출시 예정 스낵 연구소</h1>
    </div>

    <!-- 신상 스낵 리스트 -->
    <div class="card">
        <h2>🗓️ 곧 만나요! 신상 라인업</h2>
        
        <!-- 스낵 1: h4 (황치즈 고구마깡) -->
        <div class="snack-item">
            <img src="h4.jpg" class="snack-img" alt="황치즈 고구마깡">
            <div class="snack-info">
                <h3>황치즈 고구마깡 <span class="d-day">D-3</span></h3>
                <p>단짠단짠의 최고봉! 꼬릿한 황치즈와 달콤한 고구마의 완벽한 만남.</p>
            </div>
        </div>

        <!-- 스낵 2: h5 (신라면 로제) -->
        <div class="snack-item">
            <img src="h5.jpg" class="snack-img" alt="신라면 로제">
            <div class="snack-info">
                <h3>신라면 로제 <span class="d-day">D-7</span></h3>
                <p>매콤한 신라면에 부드러운 크림이 듬뿍! K-로제의 끝판왕 등장 예정.</p>
            </div>
        </div>

        <!-- 스낵 3: h6 (예감 초코범벅) -->
        <div class="snack-item">
            <img src="h6.jpg" class="snack-img" alt="예감 초코범벅">
            <div class="snack-info">
                <h3>예감 초코범벅 감자칩 <span class="d-day">D-14</span></h3>
                <p>튀기지 않은 담백한 감자칩에 진한 초코가 듬뿍 발려있는 마성의 과자.</p>
            </div>
        </div>
    </div>

    <!-- 하단 데코레이션 (연구원들의 일상) -->
    <div class="grid-2col">
        <!-- h9 (키이로이토리 카레) -->
        <div class="deco-card">
            <img src="h9.jpg" alt="키이로이토리 카레">
            <p><strong>연구소 점심시간</strong><br>오늘은 든든한 카레라이스!</p>
        </div>
        
        <!-- h10 (리락쿠마 연어알 초밥) -->
        <div class="deco-card">
            <img src="h10.jpg" alt="리락쿠마 초밥">
            <p><strong>퇴근 후 휴식</strong><br>초밥 위에서 뒹굴뒹굴~</p>
        </div>
    </div>

    <!-- 메인으로 돌아가기 -->
    <a href="index.html" class="back-btn">⬅ 메인으로</a>

</div>
</body>
</html>
