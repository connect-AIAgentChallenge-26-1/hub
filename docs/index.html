<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #fffdf8; --ink: #221b15; --muted: #857a70;
    --accent: #ff6a3d; --accent-deep: #e5501f;
    --chip: #fff3d6; --line: #efe3d7; --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(420px 300px at 10% 10%, #ffe9dc 0%, transparent 70%),
      radial-gradient(430px 320px at 90% 90%, #fff3d6 0%, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: 40px 20px;
  }
  .box { width: 100%; max-width: 460px; text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
  .tag { color: var(--muted); font-size: 15px; margin: 0 0 34px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links a {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 24px; text-decoration: none; color: var(--ink);
    box-shadow: 0 2px 14px rgba(90,60,30,0.07);
    transition: transform 0.15s, box-shadow 0.15s;
    text-align: left;
  }
  .links a:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(90,60,30,0.12); }
  .links .ic {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: var(--chip);
  }
  .links b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  .links small { color: var(--muted); font-size: 13px; }
  .links .arr { margin-left: auto; color: var(--accent); font-weight: 800; }
  footer { margin-top: 30px; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M8 22h32a1 1 0 0 1 1 1c0 8-6 15-14 16v2h-6v-2C13 38 7 31 7 23a1 1 0 0 1 1-1z" fill="#FF6A3D"/>
        <path d="M14 16c0-2 2-2 2-4s-2-2-2-4" stroke="#FFB38A" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M23 16c0-2 2-2 2-4s-2-2-2-4" stroke="#FFB38A" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M32 16c0-2 2-2 2-4s-2-2-2-4" stroke="#FFB38A" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      밥약
    </div>
    <p class="tag">언제 볼까, 어디서 볼까를 한 번에 — 대학생 밥약 매칭 서비스</p>
    <div class="links">
      <a href="./기획서_밥약매칭서비스.html">
        <span class="ic">📋</span>
        <span><b>프로젝트 기획서</b><small>문제 정의 · 시나리오 · ERD · API · 로드맵</small></span>
        <span class="arr">→</span>
      </a>
      <a href="./디자인시안_밥약웹.html">
        <span class="ic">🎨</span>
        <span><b>웹 디자인 시안</b><small>로그인부터 확정까지 6개 화면</small></span>
        <span class="arr">→</span>
      </a>
    </div>
    <footer>개인 프로젝트 · 4주 · Naver AI Challenge</footer>
  </div>
</body>
</html>
