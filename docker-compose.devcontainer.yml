services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command:
      - bash
      - -lc
      - >-
        sudo mkdir -p /workspace/frontend/.next &&
        sudo chown -R vscode:vscode /workspace/frontend/.next &&
        exec sleep infinity
    working_dir: /workspace
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-placepick}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-placepick}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-placepick-local-only}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PLACEPICK_EXTERNAL_MODE: mock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - .:/workspace:cached
      - gradle-cache:/home/vscode/.gradle
      - frontend-next-cache:/workspace/frontend/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "java -version 2>&1 | grep -Eq 'version \\\"17([.\\\"]|$)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gradle-cache:
  frontend-next-cache:
